<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daftar - ChatingYuk</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0e1a;--surface:#141a2c;--surface-2:#1a2238;--border:#232c47;--text:#e8ecf5;--text-2:#8b93ab;--text-3:#5a6480;--primary:#6366f1;--primary-soft:rgba(99,102,241,.15);--grad:linear-gradient(135deg,#6366f1,#8b5cf6 60%,#ec4899)}
[data-theme=light]{--bg:#f4f6fb;--surface:#fff;--surface-2:#f7f9fc;--border:#e2e8f0;--text:#0f172a;--text-2:#64748b;--text-3:#94a3b8;--primary-soft:rgba(99,102,241,.1)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:inherit;text-decoration:none}
.muted{color:var(--text-2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:10px;font-weight:600;font-size:14px;transition:.2s;width:100%}
.btn-primary{background:var(--grad);color:#fff;box-shadow:0 4px 16px rgba(99,102,241,.3)}
.btn-primary:hover{transform:translateY(-1px)}
.btn[disabled]{opacity:.5;pointer-events:none}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px}
.brand-logo{width:36px;height:36px;border-radius:11px;background:var(--grad);display:grid;place-items:center;color:#fff}
.brand-name{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.wrap{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
.aside{background:var(--grad);padding:44px 40px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;position:relative;overflow:hidden}
.aside::before{content:'';position:absolute;top:-40%;right:-30%;width:80%;height:80%;background:radial-gradient(circle,rgba(255,255,255,.15),transparent 60%)}
.aside>*{position:relative;z-index:1}
.aside .brand-logo{background:rgba(255,255,255,.2);box-shadow:none}
.aside .brand-name{-webkit-text-fill-color:#fff;background:none;color:#fff}
.aside h2{font-size:32px;font-weight:800;letter-spacing:-.02em;margin-bottom:14px}
.aside p{opacity:.9;font-size:15px;line-height:1.6;max-width:400px}
.main{display:flex;align-items:center;justify-content:center;padding:44px 22px;background:var(--bg)}
.card{width:100%;max-width:460px}
.card h1{font-size:28px;font-weight:800;letter-spacing:-.02em;margin-bottom:6px}
.card .sub{color:var(--text-2);font-size:14px;margin-bottom:22px}
.field{margin-bottom:12px;display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--text-2)}
.input{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text);font-size:14px;transition:.2s;outline:none}
.input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.input-wrap{position:relative}
.input-wrap .input{padding-right:42px}
.eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);padding:8px;color:var(--text-2);opacity:.7;border-radius:6px}
.eye:hover{opacity:1;background:var(--primary-soft)}
.hint{font-size:11.5px;color:var(--text-3)}
.check{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--text-2);cursor:pointer;margin:10px 0 18px}
.check input{accent-color:var(--primary);width:16px;height:16px;margin-top:1px;flex-shrink:0}
.link{color:var(--primary);font-weight:600}
.alert{padding:12px 14px;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);color:#fecaca;border-radius:10px;font-size:13px;margin-bottom:14px;display:none}
.alert.show{display:block}
.foot{text-align:center;margin-top:22px;font-size:14px;color:var(--text-2)}
.foot a{color:var(--primary);font-weight:600}
.avatar-upload{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:14px}
.avatar-label{cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px}
.avatar-preview{width:84px;height:84px;border-radius:50%;background:var(--surface-2);border:2px dashed var(--border);display:grid;place-items:center;color:var(--text-3);overflow:hidden;transition:.2s}
.avatar-preview:hover{border-color:var(--primary);color:var(--primary)}
.avatar-preview img{width:100%;height:100%;object-fit:cover}
@media(max-width:860px){.wrap{grid-template-columns:1fr}.aside{display:none}}
</style>
</head>
<body>

<div class="wrap">
  <div class="aside">
    <a href="index.html" class="brand">
      <div class="brand-logo">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
      </div>
      <span class="brand-name">ChatingYuk</span>
    </a>
    <div>
      <h2>Buat akun baru</h2>
      <p>Mulai perjalanan ngobrolmu di ChatingYuk. Gratis dan cepat.</p>
    </div>
    <small style="font-size:12px;opacity:.7">Ngobrol Tanpa Batas.</small>
  </div>

  <div class="main">
    <div class="card">
      <h1>Daftar</h1>
      <p class="sub">Isi data untuk membuat akun baru</p>

      <div id="err" class="alert"></div>

      <form id="form">
        <div class="avatar-upload">
          <label for="avatar-input" class="avatar-label">
            <div class="avatar-preview" id="av-prev">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </div>
            <span class="hint">Foto profil (opsional)</span>
          </label>
          <input type="file" id="avatar-input" accept="image/*" hidden>
        </div>

        <div class="field">
          <label for="displayName">Nama Lengkap</label>
          <input type="text" id="displayName" class="input" placeholder="Nama lengkapmu" required maxlength="40">
        </div>
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" class="input" placeholder="username unik" required pattern="[a-zA-Z0-9_]{3,20}">
          <span class="hint">Huruf, angka, underscore. Min 3 max 20.</span>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" class="input" placeholder="kamu@email.com" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <input type="password" id="password" class="input" placeholder="min 8 karakter" required minlength="8">
            <button type="button" class="eye" data-eye="password" aria-label="Lihat password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <div class="field">
          <label for="confirm">Konfirmasi Password</label>
          <input type="password" id="confirm" class="input" placeholder="ulangi password" required minlength="8">
        </div>
        <label class="check">
          <input type="checkbox" id="agree" required>
          <span>Saya setuju dengan <a href="#" class="link">Syarat dan Ketentuan</a>.</span>
        </label>
        <button type="submit" class="btn btn-primary" id="submit"><span id="btn-text">Daftar Sekarang</span></button>
      </form>

      <div class="foot">Sudah punya akun? <a href="login.html">Masuk di sini</a></div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getDatabase, ref, set, get, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
import { getStorage, ref as sRef, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

const app = initializeApp({
  apiKey: "AIzaSyCHr0eemIkfHNFDUkSaFDklp_c1OgmSnl8",
  authDomain: "mybro-9ba5f.firebaseapp.com",
  databaseURL: "https://mybro-9ba5f-default-rtdb.firebaseio.com/",
  projectId: "mybro-9ba5f",
  storageBucket: "mybro-9ba5f.appspot.com"
});
const auth = getAuth(app);
const db = getDatabase(app);
const storage = getStorage(app);

document.documentElement.setAttribute('data-theme', localStorage.getItem('cy_theme') || 'dark');
onAuthStateChanged(auth, u => { if (u) location.href = 'chat.html'; });

document.querySelectorAll('[data-eye]').forEach(btn => {
  btn.onclick = () => {
    const i = document.getElementById(btn.dataset.eye);
    i.type = i.type === 'password' ? 'text' : 'password';
  };
});

const avInput = document.getElementById('avatar-input');
const avPrev = document.getElementById('av-prev');
let avatarFile = null;

avInput.onchange = () => {
  const f = avInput.files[0];
  if (!f) return;
  if (!f.type.startsWith('image/')) return showErr('File harus gambar.');
  if (f.size > 5 * 1024 * 1024) return showErr('Gambar maksimal 5MB.');
  avatarFile = f;
  const r = new FileReader();
  r.onload = e => { avPrev.innerHTML = `<img src="${e.target.result}" alt="">`; };
  r.readAsDataURL(f);
};

const form = document.getElementById('form');
const err = document.getElementById('err');
const btn = document.getElementById('submit');
const btnText = document.getElementById('btn-text');

function showErr(m) { err.textContent = m; err.className = 'alert show'; }

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  err.className = 'alert';

  const displayName = document.getElementById('displayName').value.trim();
  const username = document.getElementById('username').value.trim().toLowerCase();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const confirm = document.getElementById('confirm').value;

  if (!displayName) return showErr('Nama lengkap wajib diisi.');
  if (!/^[a-z0-9_]{3,20}$/.test(username)) return showErr('Username tidak valid.');
  if (!/^\S+@\S+\.\S+$/.test(email)) return showErr('Format email tidak valid.');
  if (password.length < 8) return showErr('Password minimal 8 karakter.');
  if (password !== confirm) return showErr('Konfirmasi password tidak cocok.');

  btnText.textContent = 'Membuat akun...';
  btn.disabled = true;

  try {
    const un = await get(ref(db, 'usernames/' + username));
    if (un.exists()) throw new Error('Username sudah dipakai.');

    const cred = await createUserWithEmailAndPassword(auth, email, password);
    const uid = cred.user.uid;

    let photoURL = '';
    if (avatarFile) {
      try {
        const path = `avatars/${uid}/${Date.now()}_${avatarFile.name}`;
        const r = sRef(storage, path);
        await uploadBytesResumable(r, avatarFile);
        photoURL = await getDownloadURL(r);
      } catch (upErr) { console.warn('Avatar upload gagal:', upErr); }
    }

    await set(ref(db, 'users/' + uid), {
      uid, username, displayName, email, photoURL,
      bio: '', status: 'Available', online: true,
      lastSeen: Date.now(), createdAt: serverTimestamp()
    });
    await set(ref(db, 'usernames/' + username), uid);
    await set(ref(db, 'settings/' + uid), {
      theme: 'dark', enterToSend: true,
      notifMessages: true, notifGroups: true
    });

    location.href = 'chat.html';
  } catch (e2) {
    console.error(e2);
    const map = {
      'auth/email-already-in-use': 'Email sudah terdaftar.',
      'auth/weak-password': 'Password terlalu lemah.',
      'auth/invalid-email': 'Format email tidak valid.'
    };
    showErr(e2.message.includes('Username') ? e2.message : (map[e2.code] || 'Registrasi gagal. Coba lagi.'));
  } finally {
    btnText.textContent = 'Daftar Sekarang';
    btn.disabled = false;
  }
});
</script>
</body>
</html>
