<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

<title>A Sky — Demo Trading</title>

<style>
/* ============================================================
   DESIGN SYSTEM
   ============================================================ */
:root {
  --bg: #0B0E11;
  --surface: #12161C;
  --card: #181D25;
  --card-2: #1E242E;
  --border: #262C36;
  --primary: #2962FF;
  --primary-hover: #1E4FD9;
  --success: #0ECB81;
  --success-bg: rgba(14, 203, 129, 0.12);
  --danger: #F6465D;
  --danger-bg: rgba(246, 70, 93, 0.12);
  --warning: #F0B90B;
  --warning-bg: rgba(240, 185, 11, 0.12);
  --text: #EAECEF;
  --text-2: #B7BDC6;
  --muted: #7A828E;
  --muted-2: #5A616B;
  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 4px 20px rgba(0,0,0,0.3);
  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'SF Mono', 'Roboto Mono', monospace;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --nav-height: 60px;
}

[data-theme="light"] {
  --bg: #F5F7FA;
  --surface: #FFFFFF;
  --card: #FFFFFF;
  --card-2: #F0F2F5;
  --border: #E2E6EB;
  --text: #1A1D21;
  --text-2: #4A5058;
  --muted: #7A828E;
  --shadow: 0 4px 20px rgba(0,0,0,0.08);
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.5;
  overflow: hidden;
  overscroll-behavior: none;
}
body { display: flex; flex-direction: column; }
#app { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

/* Scrollbars */
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
::-webkit-scrollbar-track { background: transparent; }

/* ============================================================
   UTILITY CLASSES
   ============================================================ */
.hidden { display: none !important; }
.flex { display: flex; }
.flex-col { display: flex; flex-direction: column; }
.items-center { align-items: center; }
.justify-between { justify-content: space-between; }
.justify-center { justify-content: center; }
.gap-4 { gap: 4px; } .gap-8 { gap: 8px; } .gap-12 { gap: 12px; } .gap-16 { gap: 16px; }
.text-xs { font-size: 11px; } .text-sm { font-size: 12px; } .text-base { font-size: 14px; }
.text-lg { font-size: 16px; } .text-xl { font-size: 20px; } .text-2xl { font-size: 24px; }
.font-medium { font-weight: 500; } .font-semibold { font-weight: 600; } .font-bold { font-weight: 700; }
.text-muted { color: var(--muted); } .text-muted-2 { color: var(--muted-2); }
.text-success { color: var(--success); } .text-danger { color: var(--danger); }
.text-warning { color: var(--warning); } .text-primary { color: var(--primary); }
.text-center { text-align: center; } .text-right { text-align: right; }
.mono { font-family: var(--font-mono); }
.w-full { width: 100%; }
.relative { position: relative; }
.absolute { position: absolute; }
.pointer { cursor: pointer; }
.uppercase { text-transform: uppercase; letter-spacing: 0.5px; }
.nowrap { white-space: nowrap; }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ============================================================
   SCREENS & TRANSITIONS
   ============================================================ */
.screen {
  position: absolute;
  inset: 0;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  animation: fadeIn 0.25s ease;
}
.screen.enter-right { animation: slideInRight 0.3s ease; }
.screen.enter-left { animation: slideInLeft 0.3s ease; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideInRight { from { transform: translateX(40px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
@keyframes slideInLeft { from { transform: translateX(-40px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

/* ============================================================
   HEADER
   ============================================================ */
.app-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  min-height: 56px;
  position: relative;
  z-index: 10;
}
.app-header .logo {
  font-size: 18px;
  font-weight: 800;
  letter-spacing: -0.5px;
  background: linear-gradient(135deg, var(--primary), #5B8DEF);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.header-actions { display: flex; align-items: center; gap: 8px; }
.icon-btn {
  width: 36px; height: 36px;
  border-radius: 50%;
  border: none;
  background: transparent;
  color: var(--text-2);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: background 0.15s;
}
.icon-btn:active { background: var(--card-2); }
.icon-btn i { width: 20px; height: 20px; }

/* ============================================================
   BOTTOM NAVIGATION
   ============================================================ */
.bottom-nav {
  display: flex;
  align-items: center;
  justify-content: space-around;
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding: 6px 0 calc(6px + var(--safe-bottom));
  min-height: var(--nav-height);
  position: relative;
  z-index: 10;
}
.nav-item {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 4px 12px;
  color: var(--muted);
  background: none; border: none;
  font-size: 10px; font-weight: 500;
  cursor: pointer;
  transition: color 0.15s;
  border-radius: var(--radius-sm);
  font-family: var(--font);
}
.nav-item i { width: 22px; height: 22px; }
.nav-item.active { color: var(--primary); }
.nav-item.active i { stroke: var(--primary); }

/* ============================================================
   CARDS & LAYOUT
   ============================================================ */
.content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 12px 16px 24px;
  -webkit-overflow-scrolling: touch;
}
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 12px;
  animation: cardIn 0.3s ease both;
}
@keyframes cardIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

.section-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  margin: 16px 0 8px;
  display: flex; align-items: center; justify-content: space-between;
}
.section-title .see-all {
  font-size: 11px; font-weight: 500; color: var(--primary);
  background: none; border: none; cursor: pointer; font-family: var(--font);
}

/* ============================================================
   BUTTONS
   ============================================================ */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 12px 20px;
  border-radius: var(--radius-sm);
  border: none;
  font-size: 14px; font-weight: 600;
  font-family: var(--font);
  cursor: pointer;
  transition: transform 0.1s, opacity 0.15s, background 0.15s;
  min-height: 44px;
  user-select: none;
}
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-hover); }
.btn-success { background: var(--success); color: #fff; }
.btn-danger { background: var(--danger); color: #fff; }
.btn-outline {
  background: transparent; color: var(--text);
  border: 1px solid var(--border);
}
.btn-outline:hover { background: var(--card-2); }
.btn-ghost { background: transparent; color: var(--text-2); }
.btn-sm { padding: 8px 14px; font-size: 12px; min-height: 36px; }
.btn-lg { padding: 14px 24px; font-size: 15px; min-height: 50px; }
.btn-block { width: 100%; }
.btn i { width: 18px; height: 18px; }

/* ============================================================
   FORM ELEMENTS
   ============================================================ */
.form-group { margin-bottom: 14px; }
.form-label {
  display: block;
  font-size: 12px; font-weight: 500;
  color: var(--text-2);
  margin-bottom: 6px;
}
.form-input, .form-select {
  width: 100%;
  padding: 12px 14px;
  background: var(--card-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-size: 15px;
  font-family: var(--font);
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
  min-height: 46px;
}
.form-input:focus, .form-select:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(41, 98, 255, 0.15);
}
.form-input::placeholder { color: var(--muted-2); }
.form-input.error { border-color: var(--danger); }
.form-error { font-size: 11px; color: var(--danger); margin-top: 4px; min-height: 14px; }
.input-wrap { position: relative; }
.input-wrap .toggle-pw {
  position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
  background: none; border: none; color: var(--muted); cursor: pointer;
  padding: 8px; display: flex;
}
.input-wrap .toggle-pw i { width: 18px; height: 18px; }

/* Password strength */
.pw-strength { display: flex; gap: 4px; margin-top: 6px; }
.pw-strength .bar { flex: 1; height: 3px; border-radius: 2px; background: var(--border); transition: background 0.2s; }
.pw-strength .bar.active { background: var(--success); }
.pw-strength .bar.medium { background: var(--warning); }
.pw-strength .bar.weak { background: var(--danger); }

/* ============================================================
   BADGES & TAGS
   ============================================================ */
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 8px;
  border-radius: 6px;
  font-size: 10px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.3px;
}
.badge-demo { background: var(--warning-bg); color: var(--warning); border: 1px solid rgba(240,185,11,0.3); }
.badge-success { background: var(--success-bg); color: var(--success); }
.badge-danger { background: var(--danger-bg); color: var(--danger); }
.badge-primary { background: rgba(41,98,255,0.15); color: var(--primary); }
.badge-muted { background: var(--card-2); color: var(--muted); }

/* ============================================================
   LISTS & ROWS
   ============================================================ */
.list-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
  gap: 12px;
}
.list-row:last-child { border-bottom: none; }
.list-row .left { display: flex; align-items: center; gap: 10px; min-width: 0; }
.list-row .right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.asset-icon {
  width: 38px; height: 38px; border-radius: 50%;
  background: var(--card-2);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; color: var(--text-2);
  flex-shrink: 0;
}

/* ============================================================
   MODAL / BOTTOM SHEET
   ============================================================ */
.overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(2px);
  z-index: 100;
  display: flex; align-items: flex-end; justify-content: center;
  animation: fadeIn 0.2s;
}
.sheet {
  background: var(--surface);
  border-radius: 20px 20px 0 0;
  width: 100%; max-width: 500px;
  max-height: 90vh;
  overflow-y: auto;
  padding: 20px 16px calc(20px + var(--safe-bottom));
  animation: sheetUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.sheet-handle {
  width: 36px; height: 4px; border-radius: 2px;
  background: var(--border); margin: 0 auto 16px;
}
.sheet-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; }

.modal {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: 100;
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  animation: fadeIn 0.2s;
}
.modal-box {
  background: var(--surface);
  border-radius: var(--radius);
  width: 100%; max-width: 380px;
  padding: 20px;
  animation: cardIn 0.3s ease;
}

/* ============================================================
   TOAST
   ============================================================ */
#toast-container {
  position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
  z-index: 200; display: flex; flex-direction: column; gap: 8px;
  width: calc(100% - 32px); max-width: 400px; pointer-events: none;
}
.toast {
  background: var(--card);
  border: 1px solid var(--border);
  border-left: 3px solid var(--primary);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  box-shadow: var(--shadow);
  animation: toastIn 0.3s ease;
  display: flex; align-items: center; gap: 10px;
  font-size: 13px;
  pointer-events: auto;
}
.toast.success { border-left-color: var(--success); }
.toast.error { border-left-color: var(--danger); }
.toast.warning { border-left-color: var(--warning); }
.toast i { width: 18px; height: 18px; flex-shrink: 0; }
@keyframes toastIn { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: translateY(0); } }

/* ============================================================
   SKELETON LOADING
   ============================================================ */
.skeleton {
  background: linear-gradient(90deg, var(--card-2) 25%, var(--border) 50%, var(--card-2) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.5s infinite;
  border-radius: 6px;
}
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
.sk-line { height: 12px; margin-bottom: 8px; }
.sk-circle { width: 38px; height: 38px; border-radius: 50%; }

/* ============================================================
   SPLASH SCREEN
   ============================================================ */
#splash {
  position: fixed; inset: 0;
  background: var(--bg);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 999;
  transition: opacity 0.4s, visibility 0.4s;
}
#splash.hide { opacity: 0; visibility: hidden; }
.splash-logo {
  font-size: 42px; font-weight: 800; letter-spacing: -1.5px;
  background: linear-gradient(135deg, var(--primary), #5B8DEF);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  margin-bottom: 8px;
  animation: logoIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes logoIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
.splash-tagline { font-size: 13px; color: var(--muted); margin-bottom: 40px; animation: fadeIn 1s 0.3s both; }
.splash-loader { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ============================================================
   AUTH SCREENS
   ============================================================ */
.auth-screen { padding: 32px 24px; overflow-y: auto; }
.auth-logo { font-size: 32px; font-weight: 800; letter-spacing: -1px; text-align: center; margin-bottom: 4px;
  background: linear-gradient(135deg, var(--primary), #5B8DEF); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.auth-sub { text-align: center; color: var(--muted); font-size: 13px; margin-bottom: 32px; }
.auth-divider { display: flex; align-items: center; gap: 12px; margin: 20px 0; color: var(--muted-2); font-size: 11px; }
.auth-divider::before, .auth-divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.auth-footer { text-align: center; margin-top: 24px; font-size: 13px; color: var(--muted); }
.auth-footer a { color: var(--primary); text-decoration: none; font-weight: 600; }

/* ============================================================
   CHART
   ============================================================ */
.chart-container { position: relative; width: 100%; height: 280px; border-radius: var(--radius-sm); overflow: hidden; }
.chart-container.fullscreen {
  position: fixed; inset: 0; z-index: 150; height: 100vh; border-radius: 0; background: var(--bg);
}
.chart-toolbar {
  display: flex; gap: 6px; overflow-x: auto; padding: 8px 0;
  scrollbar-width: none;
}
.chart-toolbar::-webkit-scrollbar { display: none; }
.chart-tf {
  padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border);
  background: transparent; color: var(--muted); font-size: 12px; font-weight: 600;
  cursor: pointer; white-space: nowrap; font-family: var(--font);
}
.chart-tf.active { background: var(--primary); color: #fff; border-color: var(--primary); }

/* ============================================================
   STATS GRID
   ============================================================ */
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat-box {
  background: var(--card-2); border-radius: var(--radius-sm); padding: 12px;
}
.stat-box .label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 4px; }
.stat-box .value { font-size: 16px; font-weight: 700; font-family: var(--font-mono); }

/* ============================================================
   EMPTY STATE
   ============================================================ */
.empty-state {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 40px 20px; text-align: center; color: var(--muted);
}
.empty-state i { width: 48px; height: 48px; margin-bottom: 12px; opacity: 0.4; }
.empty-state .title { font-size: 15px; font-weight: 600; color: var(--text-2); margin-bottom: 4px; }
.empty-state .desc { font-size: 12px; margin-bottom: 16px; }

/* ============================================================
   TABS
   ============================================================ */
.tabs { display: flex; gap: 4px; background: var(--card-2); border-radius: var(--radius-sm); padding: 4px; margin-bottom: 12px; }
.tab {
  flex: 1; padding: 8px; border-radius: 6px; border: none;
  background: transparent; color: var(--muted); font-size: 12px; font-weight: 600;
  cursor: pointer; font-family: var(--font); transition: background 0.15s, color 0.15s;
}
.tab.active { background: var(--card); color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,0.15); }

/* ============================================================
   SWITCH
   ============================================================ */
.switch { position: relative; width: 44px; height: 24px; flex-shrink: 0; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch .slider {
  position: absolute; inset: 0; background: var(--border); border-radius: 24px;
  transition: background 0.2s; cursor: pointer;
}
.switch .slider::before {
  content: ''; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px;
  background: #fff; border-radius: 50%; transition: transform 0.2s;
}
.switch input:checked + .slider { background: var(--primary); }
.switch input:checked + .slider::before { transform: translateX(20px); }

/* ============================================================
   OFFLINE BANNER
   ============================================================ */
#offline-banner {
  background: var(--warning); color: #000;
  text-align: center; font-size: 12px; font-weight: 600;
  padding: 6px; display: none;
}
#offline-banner.show { display: block; }

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width: 360px) {
  .content { padding: 10px 12px 20px; }
  .nav-item { padding: 4px 8px; font-size: 9px; }
  .nav-item i { width: 20px; height: 20px; }
}
@media (orientation: landscape) and (max-height: 500px) {
  .chart-container { height: 180px; }
  .bottom-nav { min-height: 50px; }
}
</style>
</head>

<script>
// ============================================================
// CONFIG
// ============================================================
const CONFIG = {
  appName: 'A Sky',
  initialDemoBalance: 100000,
  currency: 'USD',
  fees: { taker: 0.001, maker: 0.0005 }, // 0.1% / 0.05%
  maxLeverage: 1, // no leverage in demo (spot only)
  providers: {
    crypto: 'binance',
    stocks: 'yahoo',
    forex: 'yahoo',
    news: 'none' // no free reliable news API without key
  }
};

// ============================================================
// STATE
// ============================================================
const State = {
  user: null,
  profile: null,
  demo: null,
  portfolio: null,
  watchlist: [],
  orders: [],
  positions: [],
  transactions: [],
  notifications: [],
  alerts: [],
  settings: { theme: 'dark', currency: 'USD', defaultOrderType: 'market', confirmOrders: true, showFees: true, chartType: 'candle', grid: true, volume: true },
  marketCache: {},
  activeScreen: null,
  screenStack: [],
  marketDataAvailable: true,
  firebaseReady: false,
  listeners: []
};

// ============================================================
// UTILITIES
// ============================================================
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

function fmt(n, digits = 2) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  return Number(n).toLocaleString('en-US', { minimumFractionDigits: digits, maximumFractionDigits: digits });
}
function fmtMoney(n, digits = 2) { return '$' + fmt(n, digits); }
function fmtPct(n, digits = 2) { return (n >= 0 ? '+' : '') + fmt(n, digits) + '%'; }
function fmtQty(n) { return fmt(n, n < 1 ? 6 : 2).replace(/\.?0+$/, '') || '0'; }
function uid() { return 'id_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 9); }
function now() { return Date.now(); }
function tsToDate(ts) { return ts ? new Date(ts).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—'; }
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function classNames(...a) { return a.filter(Boolean).join(' '); }

function toast(msg, type = 'info', duration = 3000) {
  const c = $('#toast-container');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  const icon = { success: 'check-circle', error: 'alert-circle', warning: 'alert-triangle', info: 'info' }[type] || 'info';
  el.innerHTML = `<i data-lucide="${icon}"></i><span>${escapeHtml(msg)}</span>`;
  c.appendChild(el);
  lucide.createIcons({ nodes: [el] });
  setTimeout(() => { el.style.opacity = '0'; el.style.transform = 'translateY(-8px)'; el.style.transition = 'all 0.3s'; setTimeout(() => el.remove(), 300); }, duration);
}

function showSkeleton(container, lines = 3) {
  container.innerHTML = Array.from({ length: lines }).map(() => `
    <div class="list-row">
      <div class="left"><div class="skeleton sk-circle"></div><div style="flex:1"><div class="skeleton sk-line" style="width:60%"></div><div class="skeleton sk-line" style="width:40%;height:10px"></div></div></div>
      <div class="skeleton sk-line" style="width:60px"></div>
    </div>`).join('');
}

function emptyState(icon, title, desc, actionLabel, actionId) {
  return `<div class="empty-state">
    <i data-lucide="${icon}"></i>
    <div class="title">${escapeHtml(title)}</div>
    <div class="desc">${escapeHtml(desc)}</div>
    ${actionLabel ? `<button class="btn btn-outline btn-sm" id="${actionId}">${escapeHtml(actionLabel)}</button>` : ''}
  </div>`;
}

// ============================================================
// MARKET DATA SERVICE
// Provider-agnostic abstraction layer.
// Crypto: Binance public REST + WebSocket (official, free, no key)
// Stocks/Forex: Yahoo Finance public endpoints via query1.finance.yahoo.com
// Note: Yahoo may be delayed. No secret keys are stored in frontend.
// ============================================================
const MarketDataService = (() => {

  // -------- Crypto (Binance) --------
  const BINANCE_BASE = 'https://api.binance.com/api/v3';

  async function binanceQuote(symbol) {
    const sym = symbol.replace('/', '').toUpperCase(); // BTC/USD -> BTCUSD
    const res = await fetchWithTimeout(`${BINANCE_BASE}/ticker/24hr?symbol=${sym}`);
    const d = await res.json();
    if (d.code) throw new Error(d.msg || 'Invalid symbol');
    return {
      symbol, name: symbol, exchange: 'BINANCE',
      price: parseFloat(d.lastPrice),
      change: parseFloat(d.priceChange),
      changePercent: parseFloat(d.priceChangePercent),
      high: parseFloat(d.highPrice),
      low: parseFloat(d.lowPrice),
      volume: parseFloat(d.volume),
      quoteVolume: parseFloat(d.quoteVolume),
      marketStatus: 'open', // crypto 24/7
      source: 'binance', delayed: false, timestamp: now()
    };
  }

  async function binanceCandles(symbol, interval, limit = 500) {
    const sym = symbol.replace('/', '').toUpperCase();
    const res = await fetchWithTimeout(`${BINANCE_BASE}/klines?symbol=${sym}&interval=${interval}&limit=${limit}`);
    const d = await res.json();
    if (d.code) throw new Error(d.msg || 'Invalid symbol');
    return d.map(k => ({
      time: Math.floor(k[0] / 1000),
      open: parseFloat(k[1]), high: parseFloat(k[2]),
      low: parseFloat(k[3]), close: parseFloat(k[4]),
      volume: parseFloat(k[5])
    }));
  }

  // -------- Stocks / Forex / Indices (Yahoo Finance) --------
  const YAHOO_BASE = 'https://query1.finance.yahoo.com/v8/finance/chart';

  async function yahooQuote(symbol) {
    const res = await fetchWithTimeout(`${YAHOO_BASE}/${encodeURIComponent(symbol)}?interval=1d&range=1d`);
    const d = await res.json();
    const r = d?.chart?.result?.[0];
    if (!r) throw new Error('Invalid symbol or no data');
    const meta = r.meta;
    const price = meta.regularMarketPrice;
    const prev = meta.chartPreviousClose || meta.previousClose || price;
    return {
      symbol: meta.symbol, name: meta.shortName || meta.longName || meta.symbol,
      exchange: meta.exchangeName || 'Yahoo', price,
      change: price - prev, changePercent: ((price - prev) / prev) * 100,
      high: meta.regularMarketDayHigh, low: meta.regularMarketDayLow,
      volume: meta.regularMarketVolume,
      marketStatus: meta.marketState === 'REGULAR' ? 'open' : (meta.marketState === 'CLOSED' ? 'closed' : 'closed'),
      source: 'yahoo', delayed: true, timestamp: now()
    };
  }

  async function yahooCandles(symbol, interval, range = '1mo') {
    const map = { '1m':'1m','5m':'5m','15m':'15m','30m':'30m','1h':'1h','4h':'1h','1d':'1d','1w':'1wk','1M':'1mo' };
    const yInterval = map[interval] || '1d';
    let yRange = range;
    if (interval === '1m') yRange = '1d';
    else if (interval === '5m' || interval === '15m' || interval === '30m') yRange = '5d';
    else if (interval === '1h' || interval === '4h') yRange = '1mo';
    else if (interval === '1d') yRange = '6mo';
    else if (interval === '1w') yRange = '2y';
    else if (interval === '1M') yRange = '5y';

    const res = await fetchWithTimeout(`${YAHOO_BASE}/${encodeURIComponent(symbol)}?interval=${yInterval}&range=${yRange}`);
    const d = await res.json();
    const r = d?.chart?.result?.[0];
    if (!r) throw new Error('Invalid symbol or no data');
    const t = r.timestamp, q = r.indicators.quote[0];
    return t.map((time, i) => ({
      time, open: q.open[i], high: q.high[i], low: q.low[i], close: q.close[i], volume: q.volume[i]
    })).filter(c => c.open != null && c.close != null);
  }

  // -------- Router --------
  function isCrypto(symbol) { return /^(BTC|ETH|BNB|SOL|XRP|ADA|DOGE|DOT|AVAX|MATIC|LINK|LTC|UNI|ATOM|XLM|NEAR|APT|ARB|OP|FIL|ETC|XMR|BCH|SHIB|TRX)/i.test(symbol.replace('/','')); }
  function isForex(symbol) { return /^[A-Z]{3}\/[A-Z]{3}$/.test(symbol) || /=X$/.test(symbol); }

  async function getQuote(symbol) {
    const cacheKey = 'q_' + symbol;
    const cached = State.marketCache[cacheKey];
    if (cached && now() - cached.t < 5000) return cached.data;
    try {
      let data;
      if (isCrypto(symbol)) data = await binanceQuote(symbol);
      else data = await yahooQuote(symbol.replace('/', '') + (symbol.includes('=') ? '' : ''));
      State.marketCache[cacheKey] = { data, t: now() };
      State.marketDataAvailable = true;
      return data;
    } catch (e) {
      console.warn('Quote error', symbol, e.message);
      if (cached) return cached.data; // fallback to cached
      throw e;
    }
  }

  async function getHistoricalCandles(symbol, interval = '1h', limit = 500) {
    if (isCrypto(symbol)) return binanceCandles(symbol, interval, limit);
    return yahooCandles(symbol, interval);
  }

  async function getMarketOverview() {
    const symbols = ['BTC/USD','ETH/USD','AAPL','TSLA','MSFT','EUR/USD','GC=F'];
    const results = await Promise.allSettled(symbols.map(s => getQuote(s)));
    return results.filter(r => r.status === 'fulfilled').map(r => r.value);
  }

  async function getSearchResults(q) {
    if (!q || q.length < 1) return [];
    const query = q.toUpperCase();
    // For crypto, use Binance exchangeInfo
    try {
      const res = await fetchWithTimeout(`${BINANCE_BASE}/exchangeInfo`);
      const d = await res.json();
      const matches = d.symbols
        .filter(s => s.status === 'TRADING' && s.quoteAsset === 'USDT' && s.symbol.includes(query))
        .slice(0, 10)
        .map(s => ({ symbol: s.baseAsset + '/USD', name: s.baseAsset, exchange: 'BINANCE', type: 'crypto' }));
      if (matches.length) return matches;
    } catch (e) {}
    // Fallback: common stocks
    const stocks = [
      { symbol: 'AAPL', name: 'Apple Inc.', exchange: 'NASDAQ', type: 'stock' },
      { symbol: 'TSLA', name: 'Tesla Inc.', exchange: 'NASDAQ', type: 'stock' },
      { symbol: 'MSFT', name: 'Microsoft Corp.', exchange: 'NASDAQ', type: 'stock' },
      { symbol: 'GOOGL', name: 'Alphabet Inc.', exchange: 'NASDAQ', type: 'stock' },
      { symbol: 'AMZN', name: 'Amazon.com Inc.', exchange: 'NASDAQ', type: 'stock' },
      { symbol: 'NVDA', name: 'NVIDIA Corp.', exchange: 'NASDAQ', type: 'stock' },
      { symbol: 'META', name: 'Meta Platforms', exchange: 'NASDAQ', type: 'stock' },
      { symbol: 'EUR/USD', name: 'Euro / US Dollar', exchange: 'FX', type: 'forex' },
      { symbol: 'GBP/USD', name: 'British Pound / US Dollar', exchange: 'FX', type: 'forex' },
      { symbol: 'GC=F', name: 'Gold Futures', exchange: 'COMEX', type: 'commodity' },
    ];
    return stocks.filter(s => s.symbol.includes(query) || s.name.toUpperCase().includes(query));
  }

  const wsConnections = {};
  function subscribeRealtime(symbol, cb) {
    if (!isCrypto(symbol)) {
      // Polling for non-crypto
      const iv = setInterval(async () => { try { cb(await getQuote(symbol)); } catch(e){} }, 5000);
      wsConnections[symbol] = { type: 'poll', iv };
      return () => clearInterval(iv);
    }
    const stream = symbol.replace('/', '').toLowerCase() + '@ticker';
    const ws = new WebSocket(`wss://stream.binance.com:9443/ws/${stream}`);
    ws.onmessage = (ev) => {
      const d = JSON.parse(ev.data);
      cb({
        symbol, price: parseFloat(d.c), change: parseFloat(d.p), changePercent: parseFloat(d.P),
        high: parseFloat(d.h), low: parseFloat(d.l), volume: parseFloat(d.v),
        marketStatus: 'open', source: 'binance', delayed: false, timestamp: now()
      });
    };
    ws.onerror = () => {};
    wsConnections[symbol] = { type: 'ws', ws };
    return () => ws.close();
  }

  function unsubscribeRealtime(symbol) {
    const c = wsConnections[symbol];
    if (!c) return;
    if (c.type === 'ws') c.ws.close();
    if (c.type === 'poll') clearInterval(c.iv);
    delete wsConnections[symbol];
  }

  async function fetchWithTimeout(url, ms = 8000) {
    const c = new AbortController();
    const t = setTimeout(() => c.abort(), ms);
    try {
      const r = await fetch(url, { signal: c.signal });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r;
    } finally { clearTimeout(t); }
  }

  return { getQuote, getHistoricalCandles, getMarketOverview, getSearchResults, subscribeRealtime, unsubscribeRealtime };
})();

// ============================================================
// TRADING ENGINE
// Pure simulation. No real assets. No real money.
// ============================================================
const TradingEngine = (() => {

  function validateOrder(order, account, quote) {
    const errors = [];
    if (!order.symbol) errors.push('Symbol is required');
    if (!['buy','sell'].includes(order.side)) errors.push('Side must be buy or sell');
    if (!['market','limit','stop','stop_limit'].includes(order.type)) errors.push('Invalid order type');
    const qty = parseFloat(order.quantity);
    if (!qty || qty <= 0 || isNaN(qty)) errors.push('Quantity must be greater than 0');
    if (order.type !== 'market') {
      const p = parseFloat(order.price);
      if (!p || p <= 0) errors.push('Price must be greater than 0 for limit/stop orders');
    }
    if (order.type === 'stop_limit') {
      const sp = parseFloat(order.stopPrice);
      if (!sp || sp <= 0) errors.push('Stop price required for stop-limit');
    }
    if (!quote || !quote.price) errors.push('Market price unavailable');
    // Balance check for buy
    if (order.side === 'buy' && quote) {
      const value = qty * quote.price;
      const fees = calculateFees(value, order.type);
      if (value + fees > account.availableBalance) errors.push('Insufficient demo balance');
    }
    // Position check for sell
    if (order.side === 'sell') {
      const pos = (State.positions || []).find(p => p.symbol === order.symbol && p.side === 'long');
      const heldQty = pos ? pos.quantity : 0;
      if (qty > heldQty) errors.push('Insufficient position quantity to sell');
    }
    return { valid: errors.length === 0, errors };
  }

  function calculateOrderValue(qty, price) { return parseFloat(qty) * parseFloat(price); }
  function calculateFees(value, orderType) {
    const rate = orderType === 'market' ? CONFIG.fees.taker : CONFIG.fees.maker;
    return value * rate;
  }

  async function executeMarketOrder(order, quote) {
    const value = calculateOrderValue(order.quantity, quote.price);
    const fees = calculateFees(value, 'market');
    const orderId = uid();
    const ts = now();
    const record = {
      orderId, symbol: order.symbol, side: order.side, type: 'market',
      quantity: parseFloat(order.quantity), price: quote.price,
      value, fees, status: 'filled', createdAt: ts, filledAt: ts,
      stopLoss: order.stopLoss || null, takeProfit: order.takeProfit || null,
      demo: true
    };
    // Update balance / position / transaction atomically
    await applyFill(record, quote);
    return record;
  }

  async function placeOrder(order, quote) {
    const v = validateOrder(order, State.demo, quote);
    if (!v.valid) throw new Error(v.errors.join('. '));

    if (order.type === 'market') {
      return executeMarketOrder(order, quote);
    }
    // Limit / Stop / Stop-Limit -> store as open order
    const orderId = uid();
    const record = {
      orderId, symbol: order.symbol, side: order.side, type: order.type,
      quantity: parseFloat(order.quantity), price: parseFloat(order.price),
      stopPrice: order.stopPrice ? parseFloat(order.stopPrice) : null,
      stopLoss: order.stopLoss || null, takeProfit: order.takeProfit || null,
      status: 'open', createdAt: now(), filledAt: null, demo: true
    };
    await dbSet(`users/${State.user.uid}/orders/${orderId}`, record);
    return record;
  }

  async function cancelOrder(orderId) {
    const o = State.orders.find(x => x.orderId === orderId);
    if (!o || o.status !== 'open') throw new Error('Order not open');
    await dbUpdate(`users/${State.user.uid}/orders/${orderId}`, { status: 'cancelled', cancelledAt: now() });
  }

  async function applyFill(order, quote) {
    const uid = State.user.uid;
    const isBuy = order.side === 'buy';
    const value = order.value;
    const fees = order.fees;

    // Update demo account balance
    const acct = State.demo;
    let newBalance, newUsedMargin, newRealized;
    if (isBuy) {
      newBalance = acct.balance - value - fees;
    } else {
      newBalance = acct.balance + value - fees;
    }
    newUsedMargin = acct.usedMargin;

    // Update or create position
    const positionsRef = `users/${uid}/positions`;
    const positions = State.positions || [];
    let pos = positions.find(p => p.symbol === order.symbol && p.side === 'long');
    if (isBuy) {
      if (pos) {
        const newQty = pos.quantity + order.quantity;
        const newEntry = (pos.entryPrice * pos.quantity + value) / newQty;
        pos.quantity = newQty; pos.entryPrice = newEntry;
        pos.updatedAt = now();
        await dbSet(`${positionsRef}/${pos.id}`, pos);
      } else {
        pos = {
          id: uid(), symbol: order.symbol, side: 'long',
          quantity: order.quantity, entryPrice: quote.price,
          currentPrice: quote.price, stopLoss: order.stopLoss || null,
          takeProfit: order.takeProfit || null,
          createdAt: now(), updatedAt: now(), demo: true
        };
        await dbSet(`${positionsRef}/${pos.id}`, pos);
      }
    } else {
      if (pos) {
        const newQty = pos.quantity - order.quantity;
        if (newQty <= 0.0000001) {
          await dbRemove(`${positionsRef}/${pos.id}`);
        } else {
          pos.quantity = newQty; pos.updatedAt = now();
          await dbSet(`${positionsRef}/${pos.id}`, pos);
        }
      }
    }

    // Record transaction
    const txId = uid();
    await dbSet(`users/${uid}/transactions/${txId}`, {
      id: txId, orderId: order.orderId, symbol: order.symbol,
      side: order.side, type: order.type, quantity: order.quantity,
      price: quote.price, value, fees, status: 'filled',
      timestamp: now(), demo: true
    });

    // Update demo account
    const realizedPL = State.demo.realizedPL + (isBuy ? -fees : (order.value - (pos ? pos.entryPrice * order.quantity : 0)) - fees);
    // Simplify realized: for sell, realized = (sellPrice - entryPrice) * qty - fees (if closing)
    // We'll compute realised properly in a full implementation; here we store gross.
    await dbUpdate(`users/${uid}/demoAccount`, {
      balance: newBalance,
      updatedAt: now()
    });

    // Save order as filled
    await dbSet(`users/${uid}/orders/${order.orderId}`, { ...order, status: 'filled', filledAt: now() });

    // Notification
    await addNotification(uid, {
      type: 'order_filled', title: 'Order Filled',
      message: `${order.side.toUpperCase()} ${fmtQty(order.quantity)} ${order.symbol} @ ${fmtMoney(quote.price)}`,
      orderId: order.orderId, read: false, timestamp: now()
    });
  }

  function calculatePnL(position, currentPrice) {
    if (!position) return { unrealized: 0, pct: 0 };
    const direction = position.side === 'long' ? 1 : -1;
    const unrealized = (currentPrice - position.entryPrice) * position.quantity * direction;
    const cost = position.entryPrice * position.quantity;
    const pct = cost ? (unrealized / cost) * 100 : 0;
    return { unrealized, pct };
  }

  return { validateOrder, calculateOrderValue, calculateFees, executeMarketOrder, placeOrder, cancelOrder, calculatePnL };
})();

// ============================================================
// FIREBASE HELPERS (wrappers)
// ============================================================
const fb = () => window.__fb;
function dbRef(path) { return fb().ref(window.__asky.db, path); }
function dbSet(path, val) { return fb().set(dbRef(path), val); }
function dbGet(path) { return fb().get(dbRef(path)); }
function dbUpdate(path, val) { return fb().update(dbRef(path), val); }
function dbPush(path, val) { return fb().push(dbRef(path), val); }
function dbRemove(path) { return fb().remove(dbRef(path)); }
function dbOnValue(path, cb) {
  const r = dbRef(path);
  const unsub = fb().onValue(r, cb);
  State.listeners.push({ path, unsub });
  return unsub;
}
function cleanupListeners() {
  State.listeners.forEach(l => { try { l.unsub(); } catch(e){} });
  State.listeners = [];
}

// ============================================================
// AUTHENTICATION
// ============================================================
async function handleRegister(e) {
  e.preventDefault();
  const name = $('#reg-name').value.trim();
  const username = $('#reg-username').value.trim();
  const email = $('#reg-email').value.trim();
  const pw = $('#reg-password').value;
  const pw2 = $('#reg-confirm').value;
  const btn = $('#reg-submit');

  // Validation
  let ok = true;
  setErr('reg-name', !name ? 'Name is required' : ''); if (!name) ok = false;
  setErr('reg-username', !username ? 'Username is required' : (username.length < 3 ? 'Min 3 characters' : '')); if (!username || username.length < 3) ok = false;
  setErr('reg-email', !email ? 'Email is required' : (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email) ? 'Invalid email' : '')); if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) ok = false;
  setErr('reg-password', !pw ? 'Password is required' : (pw.length < 6 ? 'Min 6 characters' : '')); if (!pw || pw.length < 6) ok = false;
  setErr('reg-confirm', pw !== pw2 ? 'Passwords do not match' : ''); if (pw !== pw2) ok = false;
  if (!ok) return;

  btn.disabled = true; btn.textContent = 'Creating account…';
  try {
    const cred = await fb().createUserWithEmailAndPassword(window.__asky.auth, email, pw);
    const u = cred.user;
    await fb().updateProfile(u, { displayName: name });
    await initUserData(u.uid, { name, username, email });
    toast('Account created. Demo account ready.', 'success');
    // Auth state listener will navigate
  } catch (err) {
    toast(authErrMsg(err), 'error');
    btn.disabled = false; btn.textContent = 'Create Account';
  }
}

async function handleLogin(e) {
  e.preventDefault();
  const email = $('#login-email').value.trim();
  const pw = $('#login-password').value;
  const remember = $('#login-remember').checked;
  const btn = $('#login-submit');

  let ok = true;
  setErr('login-email', !email ? 'Email is required' : (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email) ? 'Invalid email' : '')); if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) ok = false;
  setErr('login-password', !pw ? 'Password is required' : ''); if (!pw) ok = false;
  if (!ok) return;

  btn.disabled = true; btn.textContent = 'Signing in…';
  try {
    await fb().setPersistence(window.__asky.auth, remember ? fb().browserLocalPersistence : fb().browserSessionPersistence);
    await fb().signInWithEmailAndPassword(window.__asky.auth, email, pw);
    toast('Welcome back', 'success');
  } catch (err) {
    toast(authErrMsg(err), 'error');
    btn.disabled = false; btn.textContent = 'Sign In';
  }
}

async function handleForgot(e) {
  e.preventDefault();
  const email = $('#forgot-email').value.trim();
  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { toast('Enter a valid email', 'error'); return; }
  try {
    await fb().sendPasswordResetEmail(window.__asky.auth, email);
    toast('Reset link sent. Check your email.', 'success');
    navigate('login', { replace: true });
  } catch (err) { toast(authErrMsg(err), 'error'); }
}

async function handleLogout() {
  cleanupListeners();
  await fb().signOut(window.__asky.auth);
  State.user = null; State.profile = null; State.demo = null;
  toast('Signed out', 'info');
  navigate('login', { replace: true });
}

function authErrMsg(err) {
  const map = {
    'auth/email-already-in-use': 'This email is already registered.',
    'auth/invalid-email': 'Invalid email address.',
    'auth/weak-password': 'Password is too weak (min 6 characters).',
    'auth/user-not-found': 'No account found with this email.',
    'auth/wrong-password': 'Incorrect password.',
    'auth/invalid-credential': 'Invalid email or password.',
    'auth/too-many-requests': 'Too many attempts. Try again later.',
    'auth/network-request-failed': 'Network error. Check your connection.'
  };
  return map[err.code] || 'Authentication failed. Please try again.';
}

function setErr(id, msg) {
  const el = $('#' + id + '-err') || $(`[data-err="${id}"]`);

}

// REAL-TIME DATA LISTENERS
// ============================================================
function attachUserListeners(uid) {
  cleanupListeners();

  // Profile
  dbOnValue(`users/${uid}/profile`, snap => {
    if (snap.exists()) { State.profile = snap.val(); renderProfileSnippet(); }
  });
  // Demo account
  dbOnValue(`users/${uid}/demoAccount`, snap => {
    if (snap.exists()) { State.demo = snap.val(); renderDashboard(); renderPortfolio(); }
  });
  // Orders
  dbOnValue(`users/${uid}/orders`, snap => {
    State.orders = snap.exists() ? Object.values(snap.val()) : [];
    renderOrders(); renderDashboard();
  });
  // Positions
  dbOnValue(`users/${uid}/positions`, snap => {
    State.positions = snap.exists() ? Object.values(snap.val()) : [];
    renderPositions(); renderPortfolio(); renderDashboard();
  });
  // Transactions
  dbOnValue(`users/${uid}/transactions`, snap => {
    State.transactions = snap.exists() ? Object.values(snap.val()).sort((a,b) => b.timestamp - a.timestamp) : [];
    renderTransactions();
  });
  // Notifications
  dbOnValue(`users/${uid}/notifications`, snap => {
    State.notifications = snap.exists() ? Object.values(snap.val()).sort((a,b) => b.timestamp - a.timestamp) : [];
    renderNotifications(); updateNotifBadge();
  });
  // Alerts
  dbOnValue(`users/${uid}/alerts`, snap => {
    State.alerts = snap.exists() ? Object.values(snap.val()) : [];
    renderAlerts();
  });
  // Watchlist
  dbOnValue(`users/${uid}/watchlist`, snap => {
    if (snap.exists()) {
      const wl = snap.val();
      State.watchlist = Object.values(wl);
      renderWatchlist();
    }
  });
  // Settings
  dbOnValue(`users/${uid}/settings`, snap => {
    if (snap.exists()) {
      State.settings = { ...State.settings, ...snap.val() };
      applyTheme(State.settings.theme);
    }
  });
}

async function addNotification(uid, notif) {
  const id = uid + '_' + now();
  await dbSet(`users/${uid}/notifications/${id}`, notif);
}

function updateNotifBadge() {
  const unread = State.notifications.filter(n => !n.read).length;
  const badge = $('#notif-badge');
  if (badge) { badge.textContent = unread > 9 ? '9+' : unread; badge.style.display = unread ? 'flex' : 'none'; }
}

};

function navigate(name, opts = {}) {
  if (State.activeScreen === name && !opts.force) return;
  const fn = screens[name];
  if (!fn) { console.warn('Unknown screen', name); return; }
  if (!opts.replace && State.activeScreen) State.screenStack.push(State.activeScreen);
  State.activeScreen = name;
  cleanupScreenListeners();
  const app = $('#app');
  app.innerHTML = '';
  const el = fn(opts.params || {});
  if (typeof el === 'string') app.innerHTML = el;
  else if (el instanceof Node) app.appendChild(el);
  afterRender(name);
  lucide.createIcons({ nodes: [app] });
}

function goBack() {
  const prev = State.screenStack.pop();
  if (prev) { State.activeScreen = null; navigate(prev, { replace: true }); }
  else navigate('dashboard', { replace: true });
}

let screenCleanups = [];
function cleanupScreenListeners() { screenCleanups.forEach(fn => { try { fn(); } catch(e){} }); screenCleanups = []; }
function registerCleanup(fn) { screenCleanups.push(fn); }

// RENDER HELPERS (called after navigation)

function afterRender(name) {
  // Wire generic navigation
  $$('[data-nav]').forEach(el => el.addEventListener('click', e => { e.preventDefault(); navigate(el.dataset.nav); }));
  $$('#back-btn').forEach(el => el.addEventListener('click', goBack));
  $$('#header-search').forEach(el => el.addEventListener('click', () => navigate('search')));
  $$('#header-notif').forEach(el => el.addEventListener('click', () => navigate('notifications')));
  $$('#header-profile').forEach(el => el.addEventListener('click', () => navigate('profile')));
  $$('#settings-btn').forEach(el => el.addEventListener('click', () => navigate('settings')));
  $$('#logout-btn').forEach(el => el.addEventListener('click', confirmLogout));
  $$('#reset-demo-btn').forEach(el => el.addEventListener('click', confirmReset));

  // Screen-specific
  if (name === 'login') {
    $('#login-form').addEventListener('submit', handleLogin);
    $('#go-register').addEventListener('click', e => { e.preventDefault(); navigate('register'); });
    $('#forgot-link').addEventListener('click', e => { e.preventDefault(); navigate('forgot'); });
    $$('.toggle-pw').forEach(btn => btn.addEventListener('click', () => togglePw(btn.dataset.target)));
  }
  if (name === 'register') {
    $('#register-form').addEventListener('submit', handleRegister);
    $('#go-login').addEventListener('click', e => { e.preventDefault(); navigate('login'); });
    $('#reg-password').addEventListener('input', updatePwStrength);
    $$('.toggle-pw').forEach(btn => btn.addEventListener('click', () => togglePw(btn.dataset.target)));
  }
  if (name === 'forgot') {
    $('#forgot-form').addEventListener('submit', handleForgot);
    $('#back-login').addEventListener('click', e => { e.preventDefault(); navigate('login', { replace: true }); });
  }
  if (name === 'dashboard') { loadDashboardData(); updateNotifBadge(); }
  if (name === 'markets') { loadMarketsData(); wireMarketTabs(); }
  if (name === 'marketDetail') { loadMarketDetail(); }
  if (name === 'trade') { wireTradePanel(); }
  if (name === 'portfolio') { renderPortfolioAllocation(); }
  if (name === 'orders') { wireOrderTabs(); renderOrdersList('open'); }
  if (name === 'positions') { renderPositionsList(); }
  if (name === 'transactions') { renderTransactionsList(); wireTxSearch(); }
  if (name === 'watchlist') { renderWatchlistList(); wireWatchlist(); }
  if (name === 'alerts') { renderAlertsList(); wireAlerts(); }
  if (name === 'notifications') { renderNotificationsList(); }
  if (name === 'settings') { wireSettings(); }
  if (name === 'search') { wireSearch(); }
}

function togglePw(id) {
  const el = $('#' + id);
  if (!el) return;
  el.type = el.type === 'password' ? 'text' : 'password';
}

function updatePwStrength() {
  const pw = $('#reg-password').value;
  let score = 0;
  if (pw.length >= 6) score++;
  if (pw.length >= 10) score++;
  if (/[A-Z]/.test(pw)) score++;
  if (/[0-9]/.test(pw)) score++;
  if (/[^A-Za-z0-9]/.test(pw)) score++;
  score = Math.min(score, 4);
  $$('#pw-strength .bar').forEach((b, i) => {
    b.className = 'bar' + (i < score ? (score <= 2 ? ' weak' : score === 3 ? ' medium' : ' active') : '');
  });
}

  showModal('Sign Out', 'Are you sure you want to sign out?', 'Sign Out', handleLogout, 'danger');

async function doResetDemo() {
  const uid = State.user.uid;
  try {
    await dbUpdate(`users/${uid}/demoAccount`, {
      balance: CONFIG.initialDemoBalance,
      availableBalance: CONFIG.initialDemoBalance,
      equity: CONFIG.initialDemoBalance,
      usedMargin: 0, unrealizedPL: 0, realizedPL: 0, todayPL: 0,
      initialBalance: CONFIG.initialDemoBalance, totalReturn: 0,
      buyingPower: CONFIG.initialDemoBalance,
      updatedAt: now(), resetCount: (State.demo?.resetCount || 0) + 1
    });
    await dbRemove(`users/${uid}/positions`);
    await dbRemove(`users/${uid}/orders`);
    await dbRemove(`users/${uid}/transactions`);
    toast('Demo account reset', 'success');
  } catch (e) { toast('Reset failed: ' + e.message, 'error'); }
}

function showModal(title, message, confirmLabel, onConfirm, variant = 'primary') {

    <div class="modal-box">
      <div class="font-bold text-lg" style="margin-bottom:8px">${escapeHtml(title)}</div>

        <button class="btn btn-${variant} btn-block" id="modal-confirm">${escapeHtml(confirmLabel)}</button>

  document.body.appendChild(overlay);
  overlay.querySelector('#modal-cancel').onclick = () => overlay.remove();
  overlay.querySelector('#modal-confirm').onclick = () => { overlay.remove(); onConfirm(); };
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
}

async function loadDashboardData() {
  // Market overview
  const mkt = $('#dash-market');
  if (mkt) {
    try {
      const quotes = await MarketDataService.getMarketOverview();
      mkt.innerHTML = quotes.slice(0, 5).map(quoteRow).join('');
      lucide.createIcons({ nodes: [mkt] });
    } catch (e) {
      mkt.innerHTML = `<div class="empty-state"><i data-lucide="wifi-off"></i><div class="title">Market data unavailable</div><div class="desc">Check your connection</div></div>`;
      lucide.createIcons({ nodes: [mkt] });
    }
  }
  // Watchlist
  const wl = $('#dash-watchlist');
  if (wl) {
    const symbols = (State.watchlist[0]?.symbols) || [];
    if (!symbols.length) { wl.innerHTML = emptyState('star', 'No watchlist', 'Add symbols to track', 'Add', 'add-watch'); }
    else {
      wl.innerHTML = skeletonRows(Math.min(symbols.length, 4));
      const quotes = await Promise.allSettled(symbols.slice(0, 4).map(s => MarketDataService.getQuote(s)));
      wl.innerHTML = quotes.filter(r => r.status === 'fulfilled').map(r => quoteRow(r.value)).join('');
    }
  }
  // Positions
  const pos = $('#dash-positions');
  if (pos) {
    if (!State.positions.length) pos.innerHTML = emptyState('briefcase', 'No open positions', 'Place a demo trade to start');
    else pos.innerHTML = State.positions.slice(0, 3).map(positionRow).join('');
  }
  // Orders
  const ord = $('#dash-orders');
  if (ord) {
    const recent = State.orders.sort((a,b) => (b.createdAt||0) - (a.createdAt||0)).slice(0, 3);
    if (!recent.length) ord.innerHTML = emptyState('clipboard-list', 'No orders yet', 'Your order history will appear here');
    else ord.innerHTML = recent.map(orderRow).join('');
  }
  lucide.createIcons({ nodes: [$('#app')] });
}

function quoteRow(q) {
  const cls = q.changePercent >= 0 ? 'text-success' : 'text-danger';
  return `<div class="list-row" data-symbol="${escapeHtml(q.symbol)}" style="cursor:pointer" data-nav="marketDetail">
    <div class="left"><div class="asset-icon">${escapeHtml(q.symbol.slice(0,3))}</div>
      <div><div class="font-semibold text-sm">${escapeHtml(q.symbol)}</div><div class="text-xs text-muted">${escapeHtml(q.exchange || '')}</div></div></div>
    <div class="right"><div class="text-right"><div class="mono text-sm">${fmtMoney(q.price, q.price < 1 ? 6 : 2)}</div><div class="text-xs ${cls}">${fmtPct(q.changePercent)}</div></div></div>
  </div>`;
}

function positionRow(p) {
  const q = State.marketCache['q_' + p.symbol]?.data;
  const cur = q ? q.price : p.currentPrice;
  const pnl = TradingEngine.calculatePnL(p, cur);
  const cls = pnl.unrealized >= 0 ? 'text-success' : 'text-danger';
  return `<div class="list-row">
    <div class="left"><div class="asset-icon">${escapeHtml(p.symbol.slice(0,3))}</div>
      <div><div class="font-semibold text-sm">${escapeHtml(p.symbol)} <span class="badge badge-success" style="font-size:9px">LONG</span></div>
      <div class="text-xs text-muted">${fmtQty(p.quantity)} @ ${fmtMoney(p.entryPrice, p.entryPrice < 1 ? 6 : 2)}</div></div></div>
    <div class="right text-right"><div class="mono text-sm ${cls}">${fmtMoney(pnl.unrealized)}</div><div class="text-xs ${cls}">${fmtPct(pnl.pct)}</div></div>
  </div>`;
}

function orderRow(o) {

async function loadMarketsData(tab = 'crypto') {
  const list = $('#market-list');
  if (!list) return;
  list.innerHTML = skeletonRows(8);
  let symbols;
  if (tab === 'crypto') symbols = ['BTC/USD','ETH/USD','BNB/USD','SOL/USD','XRP/USD','ADA/USD','DOGE/USD','DOT/USD','LINK/USD','AVAX/USD'];
  else if (tab === 'stocks') symbols = ['AAPL','TSLA','MSFT','GOOGL','AMZN','NVDA','META','NFLX','AMD','INTC'];
  else if (tab === 'forex') symbols = ['EUR/USD','GBP/USD','USD/JPY','AUD/USD','USD/CHF','USD/CAD','NZD/USD'];
  else symbols = ['GC=F','SI=F','CL=F','NG=F','HG=F','ZC=F'];
  const results = await Promise.allSettled(symbols.map(s => MarketDataService.getQuote(s)));
  const quotes = results.filter(r => r.status === 'fulfilled').map(r => r.value);
  if (!quotes.length) { list.innerHTML = emptyState('wifi-off', 'Market data unavailable', 'The provider may be rate-limited or offline'); return; }

// ============================================================
// CHART
// ============================================================
let chartInstance = null;
async function loadChart(symbol, interval) {
  const container = $('#chart');
  if (!container) return;
  container.innerHTML = '<div class="skeleton" style="width:100%;height:100%"></div>';
  try {
    const candles = await MarketDataService.getHistoricalCandles(symbol, interval, 400);
    if (!candles.length) throw new Error('No candle data');
    container.innerHTML = '';
    if (chartInstance) { chartInstance.remove(); chartInstance = null; }
    const chart = LightweightCharts.createChart(container, {
      width: container.clientWidth,
      height: container.clientHeight,
      layout: { background: { color: 'transparent' }, textColor: getComputedStyle(document.body).getPropertyValue('--text-2') },
      grid: { vertLines: { color: getComputedStyle(document.body).getPropertyValue('--border') }, horzLines: { color: getComputedStyle(document.body).getPropertyValue('--border') } },
      crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
      rightPriceScale: { borderColor: getComputedStyle(document.body).getPropertyValue('--border') },
      timeScale: { borderColor: getComputedStyle(document.body).getPropertyValue('--border'), timeVisible: true, secondsVisible: false },
    });
    const series = chart.addCandlestickSeries({
      upColor: '#0ECB81', downColor: '#F6465D', borderVisible: false,
      wickUpColor: '#0ECB81', wickDownColor: '#F6465D'
    });
    series.setData(candles);
    chart.timeScale().fitContent();
    chartInstance = chart;
    // Responsive
    const ro = new ResizeObserver(() => { if (chartInstance) chartInstance.applyOptions({ width: container.clientWidth, height: container.clientHeight }); });
    ro.observe(container);
    registerCleanup(() => { ro.disconnect(); if (chartInstance) { chartInstance.remove(); chartInstance = null; } });
  } catch (e) {
    container.innerHTML = `<div class="empty-state"><i data-lucide="bar-chart-3"></i><div class="title">Chart unavailable</div><div class="desc">${escapeHtml(e.message)}</div></div>`;
    lucide.createIcons({ nodes: [container] });
  }
}

// ============================================================
// TRADE PANEL
// ============================================================
function wireTradePanel() {
  const sideTabs = $$('#trade-side .tab');
  const typeSel = $('#trade-type');
  const priceGroup = $('#trade-price-group');
  const stopGroup = $('#trade-stop-group');
  const preview = $('#order-preview');
  const placeBtn = $('#place-order-btn');
  let side = 'buy';

  sideTabs.forEach(t => t.addEventListener('click', () => {
    sideTabs.forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    side = t.dataset.side;
  }));

  typeSel.addEventListener('change', () => {
    const t = typeSel.value;
    priceGroup.style.display = (t === 'limit' || t === 'stop_limit') ? 'block' : 'none';
    stopGroup.style.display = (t === 'stop' || t === 'stop_limit') ? 'block' : 'none';
  });

  placeBtn.addEventListener('click', async () => {
    const symbol = $('#trade-symbol').value.trim();
    const type = typeSel.value;
    const qty = parseFloat($('#trade-qty').value);
    const price = parseFloat($('#trade-price').value) || null;
    const stop = parseFloat($('#trade-stop').value) || null;
    const sl = parseFloat($('#trade-sl').value) || null;
    const tp = parseFloat($('#trade-tp').value) || null;

    if (!symbol) { toast('Enter a symbol', 'error'); return; }
    if (!qty || qty <= 0) { toast('Enter a valid quantity', 'error'); return; }
    if ((type === 'limit' || type === 'stop_limit') && (!price || price <= 0)) { toast('Enter a valid price', 'error'); return; }
    if ((type === 'stop' || type === 'stop_limit') && (!stop || stop <= 0)) { toast('Enter a valid stop price', 'error'); return; }

    placeBtn.disabled = true; placeBtn.textContent = 'Placing…';
    try {
      const quote = await MarketDataService.getQuote(symbol);
      const order = { symbol, side, type, quantity: qty, price, stopPrice: stop, stopLoss: sl, takeProfit: tp };
      // Preview
      const value = TradingEngine.calculateOrderValue(qty, type === 'market' ? quote.price : (price || quote.price));
      const fees = TradingEngine.calculateFees(value, type);
      preview.style.display = 'block';
      preview.innerHTML = `
        <div class="text-sm font-semibold" style="margin-bottom:8px">Order Preview</div>
        <div class="list-row"><span class="text-muted text-sm">Asset</span><span class="text-sm">${escapeHtml(symbol)}</span></div>
        <div class="list-row"><span class="text-muted text-sm">Side</span><span class="text-sm uppercase ${side === 'buy' ? 'text-success' : 'text-danger'}">${side}</span></div>
        <div class="list-row"><span class="text-muted text-sm">Quantity</span><span class="text-sm mono">${fmtQty(qty)}</span></div>
        <div class="list-row"><span class="text-muted text-sm">Est. Price</span><span class="text-sm mono">${fmtMoney(quote.price, quote.price < 1 ? 6 : 2)}</span></div>
        <div class="list-row"><span class="text-muted text-sm">Est. Value</span><span class="text-sm mono">${fmtMoney(value)}</span></div>
        <div class="list-row"><span class="text-muted text-sm">Fees</span><span class="text-sm mono">${fmtMoney(fees)}</span></div>
        <div class="list-row"><span class="text-muted text-sm font-semibold">Total</span><span class="text-sm mono font-bold">${fmtMoney(value + fees)}</span></div>
        <div class="badge badge-demo" style="margin-top:8px">SIMULATED ORDER · NO REAL MONEY</div>`;

      const confirm = CONFIG.confirmOrders && State.settings.confirmOrders;
      if (confirm) {
        showModal('Place Demo Order', `Confirm ${side.toUpperCase()} ${fmtQty(qty)} ${symbol} at ~${fmtMoney(quote.price)}? This is simulated.`, 'Place Order', async () => {
          await doPlaceOrder(order, quote, placeBtn);
        }, side === 'buy' ? 'success' : 'danger');
        placeBtn.disabled = false; placeBtn.textContent = 'Review Order';
        return;
      }
      await doPlaceOrder(order, quote, placeBtn);
    } catch (e) {
      toast(e.message, 'error');
      placeBtn.disabled = false; placeBtn.textContent = 'Review Order';
    }
  });
}

async function doPlaceOrder(order, quote, btn) {
  try {
    const rec = await TradingEngine.placeOrder(order, quote);
    toast(`${order.side.toUpperCase()} order ${rec.status === 'filled' ? 'filled' : 'placed'}`, 'success');
    if (btn) { btn.disabled = false; btn.textContent = 'Review Order'; }
    $('#order-preview').style.display = 'none';
  } catch (e) {
    toast(e.message, 'error');
    if (btn) { btn.disabled = false; btn.textContent = 'Review Order'; }
  }
}

// ============================================================
// PORTFOLIO
// ============================================================
function renderPortfolioAllocation() {
  const d = State.demo || {};
  const cash = d.availableBalance || 0;
  const invested = (d.equity || 0) - cash;
  const total = cash + invested || 1;
  const cashPct = (cash / total) * 100;
  const invPct = (invested / total) * 100;
  const el = $('#allocation-chart');
  if (!el) return;
  el.innerHTML = `
    <div style="width:100%">
      <div style="display:flex;height:24px;border-radius:6px;overflow:hidden;margin-bottom:12px">
        <div style="width:${cashPct}%;background:var(--primary)"></div>
        <div style="width:${invPct}%;background:var(--success)"></div>
      </div>
      <div class="flex justify-between text-sm"><span class="flex items-center gap-4"><span style="width:10px;height:10px;border-radius:2px;background:var(--primary);display:inline-block"></span> Cash ${fmt(cashPct,1)}%</span><span class="mono">${fmtMoney(cash)}</span></div>
      <div class="flex justify-between text-sm" style="margin-top:6px"><span class="flex items-center gap-4"><span style="width:10px;height:10px;border-radius:2px;background:var(--success);display:inline-block"></span> Invested ${fmt(invPct,1)}%</span><span class="mono">${fmtMoney(invested)}</span></div>
    </div>`;
  // Positions
  const posEl = $('#portfolio-positions');
  if (posEl) {
    if (!State.positions.length) posEl.innerHTML = emptyState('briefcase', 'No positions', 'Open a demo trade to see it here');
    else posEl.innerHTML = State.positions.map(positionRow).join('');
  }
  lucide.createIcons({ nodes: [$('#app')] });
}

// ============================================================
// ORDERS
// ============================================================
function wireOrderTabs() {
  $$('#order-tabs .tab').forEach(t => t.addEventListener('click', () => {
    $$('#order-tabs .tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    renderOrdersList(t.dataset.status);
  }));
}

function renderOrdersList(status) {
  const el = $('#orders-list');
  if (!el) return;
  const filtered = State.orders.filter(o => o.status === status).sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
  if (!filtered.length) { el.innerHTML = emptyState('clipboard-list', `No ${status} orders`, 'Orders will appear here'); lucide.createIcons({ nodes: [el] }); return; }
  el.innerHTML = filtered.map(o => `
    <div class="card">
      <div class="flex justify-between items-center" style="margin-bottom:8px">
        <div class="font-semibold">${escapeHtml(o.symbol)} <span class="badge ${o.side === 'buy' ? 'badge-success' : 'badge-danger'}" style="font-size:9px">${o.side.toUpperCase()}</span></div>
        <span class="badge ${o.status === 'filled' ? 'badge-success' : o.status === 'open' ? 'badge-primary' : 'badge-muted'}">${o.status}</span>
      </div>
      <div class="text-xs text-muted">Order ID: ${escapeHtml(o.orderId)}</div>
      <div class="list-row"><span class="text-muted text-sm">Type</span><span class="text-sm">${o.type}</span></div>
      <div class="list-row"><span class="text-muted text-sm">Quantity</span><span class="text-sm mono">${fmtQty(o.quantity)}</span></div>
      <div class="list-row"><span class="text-muted text-sm">Price</span><span class="text-sm mono">${fmtMoney(o.price)}</span></div>
      <div class="list-row"><span class="text-muted text-sm">Created</span><span class="text-sm">${tsToDate(o.createdAt)}</span></div>
      ${o.status === 'open' ? `<button class="btn btn-outline btn-sm btn-block" style="margin-top:8px" data-cancel="${escapeHtml(o.orderId)}">Cancel Order</button>` : ''}
    </div>`).join('');
  $$('[data-cancel]', el).forEach(b => b.addEventListener('click', async () => {
    try { await TradingEngine.cancelOrder(b.dataset.cancel); toast('Order cancelled', 'success'); } catch(e) { toast(e.message, 'error'); }
  }));
  lucide.createIcons({ nodes: [el] });
}

// ============================================================
// POSITIONS
// ============================================================
function renderPositionsList() {
  const el = $('#positions-list');
  if (!el) return;
  if (!State.positions.length) { el.innerHTML = emptyState('briefcase', 'No open positions', 'Place a demo trade to start'); lucide.createIcons({ nodes: [el] }); return; }
  el.innerHTML = State.positions.map(p => {
    const q = State.marketCache['q_' + p.symbol]?.data;
    const cur = q ? q.price : p.currentPrice;
    const pnl = TradingEngine.calculatePnL(p, cur);
    const cls = pnl.unrealized >= 0 ? 'text-success' : 'text-danger';
    return `<div class="card">
      <div class="flex justify-between items-center">
        <div class="font-semibold">${escapeHtml(p.symbol)} <span class="badge badge-success" style="font-size:9px">LONG</span></div>
        <div class="text-right"><div class="mono font-bold ${cls}">${fmtMoney(pnl.unrealized)}</div><div class="text-xs ${cls}">${fmtPct(pnl.pct)}</div></div>
      </div>
      <div class="stat-grid" style="margin-top:10px">
        <div class="stat-box"><div class="label">Quantity</div><div class="value">${fmtQty(p.quantity)}</div></div>
        <div class="stat-box"><div class="label">Entry</div><div class="value">${fmtMoney(p.entryPrice, p.entryPrice < 1 ? 6 : 2)}</div></div>
        <div class="stat-box"><div class="label">Current</div><div class="value">${fmtMoney(cur, cur < 1 ? 6 : 2)}</div></div>
        <div class="stat-box"><div class="label">Market Value</div><div class="value">${fmtMoney(cur * p.quantity)}</div></div>
      </div>
      <button class="btn btn-outline btn-sm btn-block" style="margin-top:10px" data-close="${escapeHtml(p.id)}">Close Position</button>
    </div>`;
  }).join('');
  $$('[data-close]', el).forEach(b => b.addEventListener('click', () => closePosition(b.dataset.close)));
  lucide.createIcons({ nodes: [el] });
}

async function closePosition(posId) {
  const p = State.positions.find(x => x.id === posId);
  if (!p) return;
  try {
    const quote = await MarketDataService.getQuote(p.symbol);
    const order = { symbol: p.symbol, side: 'sell', type: 'market', quantity: p.quantity, price: quote.price };
    await TradingEngine.placeOrder(order, quote);
    toast('Position closed', 'success');
  } catch (e) { toast(e.message, 'error'); }
}

// ============================================================
// TRANSACTIONS
// ============================================================

  const el = $('#tx-list');

  if (filter) txs = txs.filter(t => t.symbol.toLowerCase().includes(filter.toLowerCase()));

      <div class="left"><div class="asset-icon">${escapeHtml(t.symbol.slice(0,3))}</div>
        <div><div class="font-semibold text-sm">${escapeHtml(t.symbol)}</div><div class="text-xs text-muted">${tsToDate(t.timestamp)}</div></div></div>
      <div class="right text-right"><div class="text-sm font-semibold ${t.side === 'buy' ? 'text-success' : 'text-danger'}">${t.side.toUpperCase()}</div>

  const inp = $('#tx-search');

// ============================================================
// WATCHLIST
// ============================================================
function renderWatchlistList() {
  const el = $('#watchlist-content');
  if (!el) return;
  const symbols = State.watchlist[0]?.symbols || [];
  if (!symbols.length) { el.innerHTML = emptyState('star', 'No watchlist', 'Add symbols to track', 'Add Symbol', 'add-watch'); wireAddWatchBtn(); lucide.createIcons({ nodes: [el] }); return; }
  el.innerHTML = skeletonRows(symbols.length);
  Promise.allSettled(symbols.map(s => MarketDataService.getQuote(s))).then(results => {
    const quotes = results.filter(r => r.status === 'fulfilled').map(r => r.value);
    el.innerHTML = quotes.map(quoteRow).join('');
    lucide.createIcons({ nodes: [el] });
  });

function wireWatchlist() {
  wireAddWatchBtn();
}

function wireAddWatchBtn() {
  const btn = $('#add-watch');
  if (!btn) return;
  btn.onclick = () => {
    const sym = prompt('Enter symbol (e.g. BTC/USD, AAPL):');
    if (!sym) return;
    const symbols = State.watchlist[0]?.symbols || [];
    if (symbols.includes(sym)) { toast('Already in watchlist', 'warning'); return; }
    symbols.push(sym);
    dbSet(`users/${State.user.uid}/watchlist/default/symbols`, symbols);
    toast('Added to watchlist', 'success');
  };
}

// ============================================================
// ALERTS
// ============================================================
function renderAlertsList() {
  const el = $('#alerts-list');
  if (!el) return;
  if (!State.alerts.length) { el.innerHTML = emptyState('bell-ring', 'No price alerts', 'Create an alert to be notified', 'Create Alert', 'add-alert'); wireAddAlertBtn(); lucide.createIcons({ nodes: [el] }); return; }
  el.innerHTML = State.alerts.map(a => `
    <div class="card">
      <div class="flex justify-between items-center">
        <div class="font-semibold">${escapeHtml(a.symbol)}</div>
        <span class="badge ${a.enabled ? 'badge-success' : 'badge-muted'}">${a.enabled ? 'ON' : 'OFF'}</span>
      </div>
      <div class="text-sm text-muted" style="margin-top:4px">Alert when price ${a.condition === 'above' ? '≥' : '≤'} ${fmtMoney(a.target)}</div>
      <div class="flex gap-8" style="margin-top:10px">
        <button class="btn btn-outline btn-sm" data-toggle="${a.id}">${a.enabled ? 'Disable' : 'Enable'}</button>
        <button class="btn btn-outline btn-sm" data-del="${a.id}" style="color:var(--danger)">Delete</button>
      </div>
    </div>`).join('');
  $$('[data-del]', el).forEach(b => b.addEventListener('click', () => { dbRemove(`users/${State.user.uid}/alerts/${b.dataset.del}`); toast('Alert deleted', 'success'); }));
  $$('[data-toggle]', el).forEach(b => b.addEventListener('click', () => {
    const a = State.alerts.find(x => x.id === b.dataset.toggle);
    if (a) dbUpdate(`users/${State.user.uid}/alerts/${a.id}`, { enabled: !a.enabled });
  }));
  lucide.createIcons({ nodes: [el] });
}

function wireAlerts() { wireAddAlertBtn(); }

function wireAddAlertBtn() {
  const btn = $('#add-alert');
  if (!btn) return;
  btn.onclick = () => {
    showAlertModal();
  };
}

function showAlertModal() {
  const overlay = document.createElement('div');
  overlay.className = 'modal';
  overlay.innerHTML = `
    <div class="modal-box">
      <div class="font-bold text-lg" style="margin-bottom:12px">Create Price Alert</div>
      <div class="form-group"><label class="form-label">Symbol</label><input id="alert-symbol" class="form-input" placeholder="BTC/USD" /></div>
      <div class="form-group"><label class="form-label">Condition</label><select id="alert-cond" class="form-select"><option value="above">Price ≥</option><option value="below">Price ≤</option></select></div>
      <div class="form-group"><label class="form-label">Target Price</label><input id="alert-target" class="form-input" type="number" step="any" placeholder="0.00" /></div>
      <div class="flex gap-8">
        <button class="btn btn-outline btn-block" id="alert-cancel">Cancel</button>
        <button class="btn btn-primary btn-block" id="alert-save">Create</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('#alert-cancel').onclick = () => overlay.remove();
  overlay.querySelector('#alert-save').onclick = async () => {
    const symbol = overlay.querySelector('#alert-symbol').value.trim();
    const condition = overlay.querySelector('#alert-cond').value;
    const target = parseFloat(overlay.querySelector('#alert-target').value);
    if (!symbol || !target) { toast('Fill all fields', 'error'); return; }
    const id = uid();
    await dbSet(`users/${State.user.uid}/alerts/${id}`, { id, symbol, condition, target, enabled: true, createdAt: now(), triggered: false });
    overlay.remove();
    toast('Alert created', 'success');
  };
}

// ============================================================
// NOTIFICATIONS
// ============================================================
function renderNotificationsList() {
  const el = $('#notif-list');
  if (!el) return;
  if (!State.notifications.length) { el.innerHTML = emptyState('bell', 'No notifications', 'You are all caught up'); lucide.createIcons({ nodes: [el] }); return; }
  el.innerHTML = State.notifications.map(n => `
    <div class="card" style="border-left:3px solid ${n.read ? 'var(--border)' : 'var(--primary)'}">
      <div class="flex justify-between items-center">
        <div class="font-semibold text-sm">${escapeHtml(n.title)}</div>
        <div class="text-xs text-muted">${tsToDate(n.timestamp)}</div>
      </div>
      <div class="text-sm text-muted" style="margin-top:4px">${escapeHtml(n.message)}</div>
    </div>`).join('');
  // Mark all read
  State.notifications.filter(n => !n.read).forEach(n => dbUpdate(`users/${State.user.uid}/notifications/${Object.keys(State.notifications).find(k => State.notifications[k] === n)}`, { read: true }).catch(()=>{}));
  lucide.createIcons({ nodes: [el] });
}

// ============================================================
// SETTINGS
// ============================================================
function wireSettings() {
  const uid = State.user.uid;
  $('#set-theme')?.addEventListener('change', e => { applyTheme(e.target.value); dbUpdate(`users/${uid}/settings`, { theme: e.target.value }); });
  $('#set-order-type')?.addEventListener('change', e => dbUpdate(`users/${uid}/settings`, { defaultOrderType: e.target.value }));
  $('#set-confirm')?.addEventListener('change', e => dbUpdate(`users/${uid}/settings`, { confirmOrders: e.target.checked }));
  $('#set-fees')?.addEventListener('change', e => dbUpdate(`users/${uid}/settings`, { showFees: e.target.checked }));
  $('#set-volume')?.addEventListener('change', e => dbUpdate(`users/${uid}/settings`, { volume: e.target.checked }));
  $('#set-tf')?.addEventListener('change', e => dbUpdate(`users/${uid}/settings`, { defaultTimeframe: e.target.value }));
}

function applyTheme(theme) {
  if (theme === 'system') theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', theme);
}

// ============================================================
// SEARCH
// ============================================================
function wireSearch() {
  const inp = $('#search-input');
  const results = $('#search-results');
  if (!inp) return;
  inp.addEventListener('input', debounce(async () => {
    const q = inp.value.trim();
    if (!q) { results.innerHTML = ''; return; }

    if (!r.length) { results.innerHTML = `<div class="text-sm text-muted" style="padding:12px 0">No results for "${escapeHtml(q)}"</div>`; return; }

      <div class="list-row" data-search-symbol="${escapeHtml(item.symbol)}" style="cursor:pointer">

      State.currentSymbol = el.dataset.searchSymbol;

  fb().onAuthStateChanged(window.__asky.auth, async (user) => {

// NETWORK / OFFLINE

window.addEventListener('online', () => { $('#offline-banner').classList.remove('show'); toast('Back online', 'success'); });
window.addEventListener('offline', () => { $('#offline-banner').classList.add('show'); toast('You are offline', 'warning'); });

// BOOT
// ============================================================
window.addEventListener('load', () => {
  lucide.createIcons();
  // Hide splash after auth resolves or timeout
  setTimeout(() => { $('#splash').classList.add('hide'); setTimeout(() => $('#splash').remove(), 500); }, 1400);
  // Global event delegation for data-nav within dynamically rendered content
  document.addEventListener('click', (e) => {
    const nav = e.target.closest('[data-nav]');
    if (nav && !nav.id && nav.dataset.nav) {
      e.preventDefault();
      navigate(nav.dataset.nav);
    }
  });
  // Re-render icons after any dynamic DOM change
  const mo = new MutationObserver(() => lucide.createIcons());
  mo.observe(document.body, { childList: true, subtree: true });
});

// Expose for debugging
window.__askyApp = { State, navigate, MarketDataService, TradingEngine };
