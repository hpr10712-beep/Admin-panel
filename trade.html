<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0B0E11" />
<title>A Sky — Demo Trading</title>
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
:root{
  --bg:#0B0E11;--surface:#12161C;--card:#181D25;--card-2:#1E242E;--border:#262C36;
  --primary:#2962FF;--primary-hover:#1E4FD9;--success:#0ECB81;--success-bg:rgba(14,203,129,.12);
  --danger:#F6465D;--danger-bg:rgba(246,70,93,.12);--warning:#F0B90B;--warning-bg:rgba(240,185,11,.12);
  --text:#EAECEF;--text-2:#B7BDC6;--muted:#7A828E;--muted-2:#5A616B;
  --radius:12px;--radius-sm:8px;--font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --font-mono:ui-monospace,'SF Mono',Menlo,monospace;--safe-bottom:env(safe-area-inset-bottom,0px);
}
[data-theme="light"]{
  --bg:#F5F7FA;--surface:#FFF;--card:#FFF;--card-2:#F0F2F5;--border:#E2E6EB;
  --text:#1A1D21;--text-2:#4A5058;--muted:#7A828E;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.5;overflow:hidden;overscroll-behavior:none}
input,textarea,select{-webkit-user-select:text;user-select:text}
#app{position:relative;width:100%;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}

/* Layout */
.screen{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.app-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--border);min-height:56px;flex-shrink:0;z-index:5}
.app-header .logo{font-size:18px;font-weight:800;letter-spacing:-.5px;background:linear-gradient(135deg,var(--primary),#5B8DEF);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.header-actions{display:flex;align-items:center;gap:4px}
.content{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px 16px 24px;-webkit-overflow-scrolling:touch;min-height:0}

/* Buttons — larger touch targets */
.icon-btn{width:44px;height:44px;border-radius:50%;border:none;background:transparent;color:var(--text-2);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s;flex-shrink:0}
.icon-btn:active{background:var(--card-2)}
.icon-btn svg,.icon-btn i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 20px;border-radius:var(--radius-sm);border:none;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;transition:transform .1s,opacity .15s,background .15s;min-height:48px;user-select:none;touch-action:manipulation}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-primary{background:var(--primary);color:#fff}
.btn-success{background:var(--success);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-outline{background:transparent;color:var(--text);border:1px solid var(--border)}
.btn-ghost{background:transparent;color:var(--text-2)}
.btn-sm{padding:8px 14px;font-size:12px;min-height:38px}
.btn-lg{padding:14px 24px;font-size:15px;min-height:52px}
.btn-block{width:100%}

/* Forms */
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:12px;font-weight:500;color:var(--text-2);margin-bottom:6px}
.form-input,.form-select{width:100%;padding:12px 14px;background:var(--card-2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:16px;font-family:inherit;outline:none;transition:border-color .15s;min-height:48px}
.form-input:focus,.form-select:focus{border-color:var(--primary)}
.form-input::placeholder{color:var(--muted-2)}
.form-input.error{border-color:var(--danger)}
.form-error{font-size:11px;color:var(--danger);margin-top:4px;min-height:14px}
.input-wrap{position:relative}
.input-wrap .toggle-pw{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);cursor:pointer;padding:10px;display:flex}

/* Cards */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.section-title{font-size:13px;font-weight:600;margin:16px 0 8px;display:flex;align-items:center;justify-content:space-between}
.section-title .see-all{font-size:11px;font-weight:500;color:var(--primary);background:none;border:none;cursor:pointer;font-family:inherit;padding:4px 8px}

/* Lists */
.list-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border);gap:12px;min-height:56px}
.list-row:last-child{border-bottom:none}
.list-row .left{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.list-row .right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.asset-icon{width:40px;height:40px;border-radius:50%;background:var(--card-2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--text-2);flex-shrink:0}
.clickable{cursor:pointer;transition:background .15s;border-radius:8px}
.clickable:active{background:var(--card-2)}

/* Nav */
.bottom-nav{display:flex;align-items:center;justify-content:space-around;background:var(--surface);border-top:1px solid var(--border);padding:4px 0 calc(4px + var(--safe-bottom));flex-shrink:0;z-index:5}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 14px;color:var(--muted);background:none;border:none;font-size:10px;font-weight:500;cursor:pointer;border-radius:8px;font-family:inherit;min-width:56px;min-height:52px;justify-content:center}
.nav-item svg,.nav-item i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav-item.active{color:var(--primary)}

/* Utility */
.hidden{display:none!important}
.flex{display:flex}.flex-col{display:flex;flex-direction:column}
.items-center{align-items:center}.justify-between{justify-content:space-between}.justify-center{justify-content:center}
.gap-4{gap:4px}.gap-8{gap:8px}.gap-12{gap:12px}.gap-16{gap:16px}
.text-xs{font-size:11px}.text-sm{font-size:12px}.text-base{font-size:14px}.text-lg{font-size:16px}.text-xl{font-size:20px}.text-2xl{font-size:24px}
.font-medium{font-weight:500}.font-semibold{font-weight:600}.font-bold{font-weight:700}
.text-muted{color:var(--muted)}.text-muted-2{color:var(--muted-2)}
.text-success{color:var(--success)}.text-danger{color:var(--danger)}.text-warning{color:var(--warning)}.text-primary{color:var(--primary)}
.text-center{text-align:center}.text-right{text-align:right}
.mono{font-family:var(--font-mono)}
.w-full{width:100%}.relative{position:relative}.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.uppercase{text-transform:uppercase;letter-spacing:.5px}.nowrap{white-space:nowrap}

/* Badges */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:6px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.badge-demo{background:var(--warning-bg);color:var(--warning);border:1px solid rgba(240,185,11,.3)}
.badge-success{background:var(--success-bg);color:var(--success)}
.badge-danger{background:var(--danger-bg);color:var(--danger)}
.badge-primary{background:rgba(41,98,255,.15);color:var(--primary)}
.badge-muted{background:var(--card-2);color:var(--muted)}

/* Splash */
#splash{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .3s,visibility .3s}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none}
.splash-logo{font-size:42px;font-weight:800;letter-spacing:-1.5px;background:linear-gradient(135deg,var(--primary),#5B8DEF);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
.splash-tagline{font-size:13px;color:var(--muted);margin-bottom:40px}
.splash-loader{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Auth */
.auth-screen{padding:32px 24px;overflow-y:auto;flex:1}
.auth-logo{font-size:32px;font-weight:800;letter-spacing:-1px;text-align:center;margin-bottom:4px;background:linear-gradient(135deg,var(--primary),#5B8DEF);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.auth-sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:32px}
.auth-footer{text-align:center;margin-top:24px;font-size:13px;color:var(--muted)}
.auth-footer a{color:var(--primary);text-decoration:none;font-weight:600}

/* Toast */
#toast-container{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:9998;display:flex;flex-direction:column;gap:8px;width:calc(100% - 24px);max-width:400px;pointer-events:none}
.toast{background:var(--card);border:1px solid var(--border);border-left:3px solid var(--primary);border-radius:var(--radius-sm);padding:12px 14px;box-shadow:0 4px 20px rgba(0,0,0,.3);display:flex;align-items:center;gap:10px;font-size:13px;pointer-events:auto;animation:slideDown .25s}
.toast.success{border-left-color:var(--success)}.toast.error{border-left-color:var(--danger)}.toast.warning{border-left-color:var(--warning)}
@keyframes slideDown{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:translateY(0)}}

/* Chart */
.chart-container{position:relative;width:100%;height:300px;min-height:300px;border-radius:var(--radius-sm);overflow:hidden;background:var(--card-2)}
.chart-toolbar{display:flex;gap:6px;overflow-x:auto;padding:8px 0;scrollbar-width:none}
.chart-toolbar::-webkit-scrollbar{display:none}
.chart-tf{padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:inherit;min-height:38px;touch-action:manipulation}
.chart-tf.active{background:var(--primary);color:#fff;border-color:var(--primary)}

/* Stats */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat-box{background:var(--card-2);border-radius:var(--radius-sm);padding:12px}
.stat-box .label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
.stat-box .value{font-size:16px;font-weight:700;font-family:var(--font-mono);word-break:break-all}

/* Empty state */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;text-align:center;color:var(--muted)}
.empty-state svg,.empty-state i{width:48px;height:48px;margin-bottom:12px;opacity:.4;stroke:currentColor;fill:none;stroke-width:2}
.empty-state .title{font-size:15px;font-weight:600;color:var(--text-2);margin-bottom:4px}
.empty-state .desc{font-size:12px;margin-bottom:16px}

/* Tabs */
.tabs{display:flex;gap:4px;background:var(--card-2);border-radius:var(--radius-sm);padding:4px;margin-bottom:12px}
.tab{flex:1;padding:10px;border-radius:6px;border:none;background:transparent;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;min-height:40px;touch-action:manipulation;transition:background .15s,color .15s}
.tab.active{background:var(--card);color:var(--text)}

/* Skeleton */
.skeleton{background:linear-gradient(90deg,var(--card-2) 25%,var(--border) 50%,var(--card-2) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:6px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.sk-line{height:12px;margin-bottom:8px}
.sk-circle{width:40px;height:40px;border-radius:50%}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:9997;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s;padding:0}
.overlay.center{align-items:center;padding:20px}
.sheet{background:var(--surface);border-radius:20px 20px 0 0;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;padding:20px 16px calc(20px + var(--safe-bottom));animation:sheetUp .3s cubic-bezier(.16,1,.3,1)}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-box{background:var(--surface);border-radius:var(--radius);width:100%;max-width:380px;padding:20px}

/* Offline banner */
#offline-banner{background:var(--warning);color:#000;text-align:center;font-size:12px;font-weight:600;padding:6px;display:none}
#offline-banner.show{display:block}

/* Error banner */
#boot-error{position:fixed;top:0;left:0;right:0;background:var(--danger);color:#fff;padding:10px 14px;font-size:12px;z-index:10000;text-align:center;display:none}
#boot-error.show{display:block}

/* PW strength */
.pw-strength{display:flex;gap:4px;margin-top:6px}
.pw-strength .bar{flex:1;height:3px;border-radius:2px;background:var(--border);transition:background .2s}
.pw-strength .bar.active{background:var(--success)}
.pw-strength .bar.medium{background:var(--warning)}
.pw-strength .bar.weak{background:var(--danger)}
</style>
</head>

  <div class="splash-tagline">Trade the Market. Practice Without Risk.</div>
  <div class="splash-loader"></div>

<!-- App -->
<script>
'use strict';

/* ============================================================
   CONFIG
   ============================================================ */
const CONFIG = {
  initialDemoBalance: 100000,
  fees: { taker: 0.001, maker: 0.0005 }
};

/* ============================================================
   STATE
   ============================================================ */
const State = {
  user: null, profile: null, demo: null,
  watchlist: [], orders: [], positions: [], transactions: [], notifications: [], alerts: [],
  settings: { theme: 'dark', confirmOrders: true },
  marketCache: {},
  currentSymbol: 'BTC/USD',
  currentTimeframe: '1h',
  listeners: [],
  screenCleanups: [],
  chart: null
};

/* ============================================================
   UTILS
   ============================================================ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const fmt = (n, d = 2) => (n == null || isNaN(n)) ? '—' : Number(n).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const fmtMoney = (n, d = 2) => '$' + fmt(n, d);
const fmtPct = (n, d = 2) => (n >= 0 ? '+' : '') + fmt(n, d) + '%';
const fmtQty = (n) => fmt(n, n < 1 ? 6 : 2).replace(/\.?0+$/, '') || '0';
const uid = () => 'id_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
const now = () => Date.now();
const tsToDate = (ts) => ts ? new Date(ts).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—';
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function toast(msg, type = 'info', dur = 3000) {
  const c = $('#toast-container');
  if (!c) return;
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  const icons = { success: 'check-circle', error: 'alert-circle', warning: 'alert-triangle', info: 'info' };
  el.innerHTML = `<i data-lucide="${icons[type] || 'info'}"></i><span>${esc(msg)}</span>`;
  c.appendChild(el);
  safeIcons(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(() => el.remove(), 300); }, dur);
}

function safeIcons(root) {
  try { if (window.lucide) window.lucide.createIcons(root ? { nodes: [root] } : undefined); }
  catch (e) { /* ignore */ }
}

function emptyState(icon, title, desc, actionLabel, actionId) {
  return `<div class="empty-state">
    <i data-lucide="${icon}"></i>
    <div class="title">${esc(title)}</div>
    <div class="desc">${esc(desc)}</div>
    ${actionLabel ? `<button class="btn btn-outline btn-sm" id="${actionId}">${esc(actionLabel)}</button>` : ''}
  </div>`;
}

function skeletonRows(n) {
  return Array.from({ length: n }).map(() => `
    <div class="list-row">
      <div class="left"><div class="skeleton sk-circle"></div><div style="flex:1"><div class="skeleton sk-line" style="width:60%"></div><div class="skeleton sk-line" style="width:40%;height:10px"></div></div></div>
      <div class="skeleton sk-line" style="width:60px"></div>
    </div>`).join('');
}

/* ============================================================
   FIREBASE WRAPPERS
   ============================================================ */
const fb = () => window.__fb;
function dbRef(p) { return fb().ref(p); }
function dbSet(p, v) { return fb().set(fb().ref(p), v); }
function dbGet(p) { return fb().get(fb().ref(p)); }
function dbUpdate(p, v) { return fb().update(fb().ref(p), v); }
function dbRemove(p) { return fb().remove(fb().ref(p)); }
function dbOnValue(p, cb) {
  const unsub = fb().onValue(fb().ref(p), cb);
  State.listeners.push({ p, unsub });
  return unsub;
}
function cleanupUserListeners() {
  State.listeners.forEach(l => { try { l.unsub(); } catch (e) { } });
  State.listeners = [];
}

/* ============================================================
   MARKET DATA SERVICE
   ============================================================ */
const MarketData = (() => {
  const BINANCE = 'https://api.binance.com/api/v3';
  const YAHOO = 'https://query1.finance.yahoo.com/v8/finance/chart';

  async function fetchTimeout(url, ms = 8000) {
    const c = new AbortController();
    const t = setTimeout(() => c.abort(), ms);
    try {
      const r = await fetch(url, { signal: c.signal });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r;
    } finally { clearTimeout(t); }
  }

  function isCrypto(sym) { return /^(BTC|ETH|BNB|SOL|XRP|ADA|DOGE|DOT|AVAX|MATIC|LINK|LTC|UNI|ATOM|XLM|NEAR|APT|ARB|OP|FIL|ETC|BCH|SHIB|TRX)/i.test(sym.replace('/', '')); }

  async function binanceQuote(symbol) {
    const sym = symbol.replace('/', '').toUpperCase();
    const r = await fetchTimeout(`${BINANCE}/ticker/24hr?symbol=${sym}`);
    const d = await r.json();
    if (d.code) throw new Error(d.msg || 'Invalid symbol');
    return {
      symbol, name: symbol, exchange: 'BINANCE',
      price: +d.lastPrice, change: +d.priceChange, changePercent: +d.priceChangePercent,
      high: +d.highPrice, low: +d.lowPrice, volume: +d.volume,
      marketStatus: 'open', delayed: false, timestamp: now()
    };
  }

  async function yahooQuote(symbol) {
    const r = await fetchTimeout(`${YAHOO}/${encodeURIComponent(symbol)}?interval=1d&range=1d`);
    const d = await r.json();
    const res = d?.chart?.result?.[0];
    if (!res) throw new Error('Invalid symbol');
    const m = res.meta;
    const price = m.regularMarketPrice;
    const prev = m.chartPreviousClose || m.previousClose || price;
    return {
      symbol: m.symbol, name: m.shortName || m.symbol, exchange: m.exchangeName || 'Yahoo',
      price, change: price - prev, changePercent: ((price - prev) / prev) * 100,
      high: m.regularMarketDayHigh, low: m.regularMarketDayLow, volume: m.regularMarketVolume,
      marketStatus: m.marketState === 'REGULAR' ? 'open' : 'closed',
      delayed: true, timestamp: now()
    };
  }

  async function getQuote(symbol) {
    const key = 'q_' + symbol;
    const c = State.marketCache[key];
    if (c && now() - c.t < 5000) return c.data;
    let data;
    if (isCrypto(symbol)) data = await binanceQuote(symbol);
    else data = await yahooQuote(symbol);
    State.marketCache[key] = { data, t: now() };
    return data;
  }

  async function binanceCandles(symbol, interval, limit = 500) {
    const map = { '1m': '1m', '5m': '5m', '15m': '15m', '30m': '30m', '1h': '1h', '4h': '4h', '1d': '1d', '1w': '1w', '1M': '1M' };
    const i = map[interval] || '1h';
    const sym = symbol.replace('/', '').toUpperCase();
    const r = await fetchTimeout(`${BINANCE}/klines?symbol=${sym}&interval=${i}&limit=${limit}`);
    const d = await r.json();
    if (d.code) throw new Error(d.msg || 'Invalid symbol');
    return d.map(k => ({ time: Math.floor(k[0] / 1000), open: +k[1], high: +k[2], low: +k[3], close: +k[4], volume: +k[5] }));
  }

  async function yahooCandles(symbol, interval) {
    const map = { '1m': ['1m', '1d'], '5m': ['5m', '5d'], '15m': ['15m', '5d'], '30m': ['30m', '5d'], '1h': ['1h', '1mo'], '4h': ['1h', '1mo'], '1d': ['1d', '6mo'], '1w': ['1wk', '2y'], '1M': ['1mo', '5y'] };
    const [yi, yr] = map[interval] || ['1d', '6mo'];
    const r = await fetchTimeout(`${YAHOO}/${encodeURIComponent(symbol)}?interval=${yi}&range=${yr}`);
    const d = await r.json();
    const res = d?.chart?.result?.[0];
    if (!res) throw new Error('Invalid symbol');
    const t = res.timestamp, q = res.indicators.quote[0];
    return t.map((time, i) => ({ time, open: q.open[i], high: q.high[i], low: q.low[i], close: q.close[i], volume: q.volume[i] }))
      .filter(c => c.open != null && c.close != null);
  }

  async function getCandles(symbol, interval, limit) {
    if (isCrypto(symbol)) return binanceCandles(symbol, interval, limit);
    return yahooCandles(symbol, interval);
  }

  async function getMarketOverview() {
    const syms = ['BTC/USD', 'ETH/USD', 'AAPL', 'TSLA', 'EUR/USD'];
    const r = await Promise.allSettled(syms.map(s => getQuote(s)));
    return r.filter(x => x.status === 'fulfilled').map(x => x.value);
  }

  async function search(q) {
    if (!q || !q.trim()) return [];
    const query = q.toUpperCase().trim();
    const results = [];
    try {
      const r = await fetchTimeout(`${BINANCE}/exchangeInfo`);
      const d = await r.json();
      d.symbols
        .filter(s => s.status === 'TRADING' && s.quoteAsset === 'USDT' && s.symbol.includes(query))
        .slice(0, 8)
        .forEach(s => results.push({ symbol: s.baseAsset + '/USD', name: s.baseAsset, exchange: 'BINANCE', type: 'crypto' }));
    } catch (e) { }
    const stocks = [
      { symbol: 'AAPL', name: 'Apple Inc.', exchange: 'NASDAQ', type: 'stock' },
      { symbol: 'TSLA', name: 'Tesla Inc.', exchange: 'NASDAQ', type: 'stock' },
      { symbol: 'MSFT', name: 'Microsoft Corp.', exchange: 'NASDAQ', type: 'stock' },
      { symbol: 'GOOGL', name: 'Alphabet Inc.', exchange: 'NASDAQ', type: 'stock' },
      { symbol: 'AMZN', name: 'Amazon.com Inc.', exchange: 'NASDAQ', type: 'stock' },
      { symbol: 'NVDA', name: 'NVIDIA Corp.', exchange: 'NASDAQ', type: 'stock' },
      { symbol: 'META', name: 'Meta Platforms', exchange: 'NASDAQ', type: 'stock' },
      { symbol: 'EUR/USD', name: 'Euro / US Dollar', exchange: 'FX', type: 'forex' },
      { symbol: 'GBP/USD', name: 'British Pound / US Dollar', exchange: 'FX', type: 'forex' },
      { symbol: 'GC=F', name: 'Gold Futures', exchange: 'COMEX', type: 'commodity' }
    ];
    stocks.forEach(s => {
      if (s.symbol.includes(query) || s.name.toUpperCase().includes(query)) {
        if (!results.find(x => x.symbol === s.symbol)) results.push(s);
      }
    });
    return results.slice(0, 12);
  }

  const realtimeSubs = {};
  function subscribe(symbol, cb) {
    if (!isCrypto(symbol)) {
      const iv = setInterval(async () => { try { cb(await getQuote(symbol)); } catch (e) { } }, 8000);
      realtimeSubs[symbol] = { type: 'poll', iv };
      return () => clearInterval(iv);
    }
    try {
      const stream = symbol.replace('/', '').toLowerCase() + '@ticker';
      const ws = new WebSocket(`wss://stream.binance.com:9443/ws/${stream}`);
      ws.onmessage = (ev) => {
        try {
          const d = JSON.parse(ev.data);
          cb({ symbol, price: +d.c, change: +d.p, changePercent: +d.P, marketStatus: 'open', delayed: false, timestamp: now() });
        } catch (e) { }
      };
      realtimeSubs[symbol] = { type: 'ws', ws };
      return () => { try { ws.close(); } catch (e) { } };
    } catch (e) {
      return () => { };
    }
  }

  return { getQuote, getCandles, getMarketOverview, search, subscribe };
})();

/* ============================================================
   TRADING ENGINE
   ============================================================ */
const TradingEngine = (() => {
  function validate(order, account, quote) {
    const errs = [];
    if (!order.symbol) errs.push('Symbol required');
    if (!['buy', 'sell'].includes(order.side)) errs.push('Invalid side');
    const qty = +order.quantity;
    if (!qty || qty <= 0 || isNaN(qty)) errs.push('Quantity must be > 0');
    if (order.type !== 'market') {
      const p = +order.price;
      if (!p || p <= 0) errs.push('Price must be > 0');
    }
    if (!quote || !quote.price) errs.push('No market price');
    if (order.side === 'buy' && quote) {
      const val = qty * quote.price;
      const fee = val * CONFIG.fees.taker;
      if (val + fee > (account?.availableBalance || 0)) errs.push('Insufficient demo balance');
    }
    if (order.side === 'sell') {
      const pos = (State.positions || []).find(p => p.symbol === order.symbol);
      const held = pos ? pos.quantity : 0;
      if (qty > held) errs.push('Insufficient position');
    }
    return { valid: errs.length === 0, errors: errs };
  }

  function fees(value, type) {
    return value * (type === 'market' ? CONFIG.fees.taker : CONFIG.fees.maker);
  }

  function calcPnL(pos, currentPrice) {
    if (!pos) return { unrealized: 0, pct: 0 };
    const dir = pos.side === 'long' ? 1 : -1;
    const unreal = (currentPrice - pos.entryPrice) * pos.quantity * dir;
    const cost = pos.entryPrice * pos.quantity;
    return { unrealized: unreal, pct: cost ? (unreal / cost) * 100 : 0 };
  }

  async function place(order, quote) {
    const v = validate(order, State.demo, quote);
    if (!v.valid) throw new Error(v.errors.join('. '));

    const orderId = uid();
    const isMarket = order.type === 'market';
    const record = {
      orderId, symbol: order.symbol, side: order.side, type: order.type,
      quantity: +order.quantity, price: +order.price || quote.price,
      stopPrice: order.stopPrice ? +order.stopPrice : null,
      stopLoss: order.stopLoss || null, takeProfit: order.takeProfit || null,
      status: isMarket ? 'filled' : 'open',
      createdAt: now(), filledAt: isMarket ? now() : null, demo: true
    };

    if (!isMarket) {
      await dbSet(`users/${State.user.uid}/orders/${orderId}`, record);
      await addNotif('order_placed', 'Order Placed', `${order.side.toUpperCase()} ${fmtQty(order.quantity)} ${order.symbol} @ ${fmtMoney(record.price)}`);
      return record;
    }

    // Market: apply fill
    const value = record.quantity * quote.price;
    const fee = fees(value, 'market');
    const isBuy = order.side === 'buy';

    // Read current state fresh (avoid race)
    const acctSnap = await dbGet(`users/${State.user.uid}/demoAccount`);
    const acct = acctSnap.val() || State.demo;
    let newBalance = isBuy ? acct.balance - value - fee : acct.balance + value - fee;
    if (newBalance < 0 && isBuy) throw new Error('Insufficient demo balance');

    // Update balance
    await dbUpdate(`users/${State.user.uid}/demoAccount`, {
      balance: newBalance, availableBalance: newBalance, updatedAt: now()
    });

    // Position
    const posSnap = await dbGet(`users/${State.user.uid}/positions`);
    const positions = posSnap.exists() ? posSnap.val() : {};
    let pos = Object.values(positions).find(p => p.symbol === order.symbol && p.side === 'long');
    if (isBuy) {
      if (pos) {
        const newQty = pos.quantity + record.quantity;
        const newEntry = (pos.entryPrice * pos.quantity + value) / newQty;
        await dbUpdate(`users/${State.user.uid}/positions/${pos.id}`, {
          quantity: newQty, entryPrice: newEntry, updatedAt: now()
        });
      } else {
        const newPos = {
          id: uid(), symbol: order.symbol, side: 'long',
          quantity: record.quantity, entryPrice: quote.price, currentPrice: quote.price,
          stopLoss: order.stopLoss || null, takeProfit: order.takeProfit || null,
          createdAt: now(), updatedAt: now(), demo: true
        };
        await dbSet(`users/${State.user.uid}/positions/${newPos.id}`, newPos);
      }
    } else {
      if (pos) {
        const newQty = pos.quantity - record.quantity;
        if (newQty <= 1e-8) await dbRemove(`users/${State.user.uid}/positions/${pos.id}`);
        else await dbUpdate(`users/${State.user.uid}/positions/${pos.id}`, { quantity: newQty, updatedAt: now() });
      }
    }

    // Order record
    await dbSet(`users/${State.user.uid}/orders/${orderId}`, record);

    // Transaction
    await dbSet(`users/${State.user.uid}/transactions/${uid()}`, {
      orderId, symbol: order.symbol, side: order.side, type: order.type,
      quantity: record.quantity, price: quote.price, value, fees: fee,
      status: 'filled', timestamp: now(), demo: true
    });

    await addNotif('order_filled', 'Order Filled', `${order.side.toUpperCase()} ${fmtQty(order.quantity)} ${order.symbol} @ ${fmtMoney(quote.price)}`);
    return record;
  }

  async function cancel(orderId) {
    const o = State.orders.find(x => x.orderId === orderId);
    if (!o || o.status !== 'open') throw new Error('Order not open');
    await dbUpdate(`users/${State.user.uid}/orders/${orderId}`, { status: 'cancelled', cancelledAt: now() });
  }

  return { validate, fees, calcPnL, place, cancel };
})();

function authErrMsg(e) {
  const m = {
    'auth/email-already-in-use': 'Email already registered',
    'auth/invalid-email': 'Invalid email',
    'auth/weak-password': 'Password too weak (min 6)',
    'auth/user-not-found': 'No account found',

    'auth/invalid-credential': 'Invalid email or password',
    'auth/too-many-requests': 'Too many attempts. Try later',
    'auth/network-request-failed': 'Network error'
  };
  return m[e.code] || (e.message || 'Authentication failed');

function setErr(id, msg) {
  const el = $(`[data-err="${id}"]`);

  if (inp) inp.classList.toggle('error', !!msg);

   ============================================================ */
const Screens = {};
let activeScreen = null;

function navigate(name, params = {}, opts = {}) {
  const fn = Screens[name];
  if (!fn) { console.warn('Unknown screen', name); return; }
  runCleanups();
  activeScreen = name;
  const app = $('#app');
  app.innerHTML = '';
  const html = fn(params);
  app.innerHTML = html;
  safeIcons(app);
  wireCommon();
  const after = Screens['_' + name + '_after'];
  if (after) after(params);
}

function runCleanups() {
  State.screenCleanups.forEach(fn => { try { fn(); } catch (e) { } });
  State.screenCleanups = [];
  if (State.chart) { try { State.chart.remove(); } catch (e) { } State.chart = null; }
}
function registerCleanup(fn) { State.screenCleanups.push(fn); }

function wireCommon() {
  // Nav buttons
  $$('[data-nav]').forEach(el => {
    el.addEventListener('click', (e) => {
      e.preventDefault();
      const target = el.dataset.nav;
      const params = el.dataset.params ? JSON.parse(el.dataset.params) : {};
      navigate(target, params);
    });
  });
  // Back buttons
  $$('[data-back]').forEach(el => el.addEventListener('click', () => navigate('dashboard')));
  // Icon header buttons
  $$('#go-search').forEach(el => el.addEventListener('click', () => navigate('search')));
  $$('#go-notif').forEach(el => el.addEventListener('click', () => navigate('notifications')));
  $$('#go-profile').forEach(el => el.addEventListener('click', () => navigate('profile')));
  $$('#go-settings').forEach(el => el.addEventListener('click', () => navigate('settings')));
  $$('#go-logout').forEach(el => el.addEventListener('click', () => confirmLogout()));
  $$('#go-reset').forEach(el => el.addEventListener('click', () => confirmReset()));
}

async function loadDashMarket() {
  const el = $('#dash-market');
  if (!el) return;
  try {
    const quotes = await MarketData.getMarketOverview();
    if (!quotes.length) throw new Error('No data');
    el.innerHTML = quotes.map(quoteRow).join('');
    safeIcons(el);
    wireSymbolClicks(el);
  } catch (e) {
    el.innerHTML = emptyState('wifi-off', 'Market data unavailable', 'Check your internet');
    safeIcons(el);
  }
}

async function loadDashWatchlist() {
  const el = $('#dash-watchlist');
  if (!el) return;
  const symbols = State.watchlist[0]?.symbols || [];
  if (!symbols.length) {
    el.innerHTML = emptyState('star', 'No watchlist', 'Add symbols to track');
    safeIcons(el);
    return;
  }
  const results = await Promise.allSettled(symbols.slice(0, 4).map(s => MarketData.getQuote(s)));
  const quotes = results.filter(r => r.status === 'fulfilled').map(r => r.value);
  if (!quotes.length) { el.innerHTML = emptyState('wifi-off', 'Data unavailable', ''); safeIcons(el); return; }
  el.innerHTML = quotes.map(quoteRow).join('');
  safeIcons(el);
  wireSymbolClicks(el);
}

function renderDashPositions() {
  const el = $('#dash-positions');
  if (!el) return;
  if (!State.positions.length) { el.innerHTML = emptyState('briefcase', 'No open positions', 'Place a demo trade to start'); safeIcons(el); return; }
  el.innerHTML = State.positions.slice(0, 3).map(positionRow).join('');
  safeIcons(el);
}

function renderDashOrders() {
  const el = $('#dash-orders');
  if (!el) return;
  const recent = [...State.orders].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)).slice(0, 3);
  if (!recent.length) { el.innerHTML = emptyState('clipboard-list', 'No orders yet', 'Your order history will appear here'); safeIcons(el); return; }
  el.innerHTML = recent.map(orderRow).join('');
  safeIcons(el);
}

function quoteRow(q) {
  const cls = q.changePercent >= 0 ? 'text-success' : 'text-danger';
  return `<div class="list-row clickable" data-symbol="${esc(q.symbol)}">
    <div class="left">
      <div class="asset-icon">${esc(q.symbol.slice(0, 3))}</div>
      <div><div class="font-semibold text-sm">${esc(q.symbol)}</div><div class="text-xs text-muted">${esc(q.exchange || '')}</div></div>
    </div>
    <div class="right">
      <div class="text-right">
        <div class="mono text-sm">${fmtMoney(q.price, q.price < 1 ? 6 : 2)}</div>
        <div class="text-xs ${cls}">${fmtPct(q.changePercent)}</div>
      </div>
    </div>
  </div>`;
}

function positionRow(p) {
  const q = State.marketCache['q_' + p.symbol]?.data;
  const cur = q ? q.price : p.currentPrice;
  const pnl = TradingEngine.calcPnL(p, cur);
  const cls = pnl.unrealized >= 0 ? 'text-success' : 'text-danger';
  return `<div class="list-row">
    <div class="left">
      <div class="asset-icon">${esc(p.symbol.slice(0, 3))}</div>

      <div class="text-xs ${cls}">${fmtPct(pnl.pct)}</div>
    </div>

function orderRow(o) {

async function loadChart(symbol, interval) {
  const container = $('#chart');
  if (!container) return;
  container.innerHTML = '<div class="skeleton" style="width:100%;height:100%"></div>';

  if (State.chart) { try { State.chart.remove(); } catch (e) { } State.chart = null; }

  try {
    const candles = await MarketData.getCandles(symbol, interval, 400);
    if (!candles.length) throw new Error('No data');

    container.innerHTML = '';
    const chart = LightweightCharts.createChart(container, {
      width: container.clientWidth,
      height: container.clientHeight,
      layout: { background: { color: 'transparent' }, textColor: getComputedStyle(document.body).getPropertyValue('--text-2').trim() || '#B7BDC6' },
      grid: { vertLines: { color: 'rgba(128,128,128,0.1)' }, horzLines: { color: 'rgba(128,128,128,0.1)' } },
      rightPriceScale: { borderColor: 'rgba(128,128,128,0.2)' },
      timeScale: { borderColor: 'rgba(128,128,128,0.2)', timeVisible: true, secondsVisible: false }
    });
    const series = chart.addCandlestickSeries({
      upColor: '#0ECB81', downColor: '#F6465D', borderVisible: false,
      wickUpColor: '#0ECB81', wickDownColor: '#F6465D'
    });
    series.setData(candles);
    chart.timeScale().fitContent();
    State.chart = chart;

    const ro = new ResizeObserver(() => {
      if (State.chart && container.clientWidth > 0) {
        State.chart.applyOptions({ width: container.clientWidth, height: container.clientHeight });
      }
    });
    ro.observe(container);
    registerCleanup(() => ro.disconnect());
  } catch (e) {
    container.innerHTML = `<div class="empty-state"><i data-lucide="bar-chart-3"></i><div class="title">Chart unavailable</div><div class="desc">${esc(e.message)}</div></div>`;
    safeIcons(container);
  }
}

Screens._trade_after = async (params) => {
  const symbolInput = $('#trade-symbol');
  let currentQuote = null;

  async function refreshPrice() {
    const sym = symbolInput.value.trim();
    const hint = $('#price-hint');
    if (!sym) { hint.textContent = 'Enter a symbol'; return; }
    hint.textContent = 'Loading market price…';
    try {
      currentQuote = await MarketData.getQuote(sym);
      hint.innerHTML = `Market: <span class="mono">${fmtMoney(currentQuote.price, currentQuote.price < 1 ? 6 : 2)}</span>`;
    } catch (e) {
      currentQuote = null;
      hint.textContent = 'Market data unavailable for this symbol';
    }
  }

  refreshPrice();
  symbolInput.addEventListener('change', refreshPrice);
  symbolInput.addEventListener('input', debounce(refreshPrice, 500));

  $$('#trade-side .tab').forEach(t => t.addEventListener('click', () => {
    $$('#trade-side .tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    const side = t.dataset.side;
    State.tradeSide = side;
    const btn = $('#place-order-btn');
    btn.className = `btn ${side === 'buy' ? 'btn-success' : 'btn-danger'} btn-block btn-lg`;
    btn.textContent = `Place ${side.toUpperCase()} Order`;
  }));

  $('#trade-type').addEventListener('change', () => {
    const v = $('#trade-type').value;
    $('#trade-price-group').style.display = v === 'limit' ? 'block' : 'none';
  });

  $('#place-order-btn').addEventListener('click', async () => {
    const sym = symbolInput.value.trim();
    const side = $('#trade-side .tab.active').dataset.side;
    const type = $('#trade-type').value;
    const qty = parseFloat($('#trade-qty').value);
    const price = parseFloat($('#trade-price').value) || null;

    if (!sym) { toast('Enter a symbol', 'error'); return; }
    if (!qty || qty <= 0) { toast('Enter a valid quantity', 'error'); return; }
    if (type === 'limit' && (!price || price <= 0)) { toast('Enter a valid limit price', 'error'); return; }
    if (!currentQuote) { try { currentQuote = await MarketData.getQuote(sym); } catch (e) { toast('Market data unavailable', 'error'); return; } }

    const order = { symbol: sym, side, type, quantity: qty, price, stopLoss: null, takeProfit: null };

    const v = TradingEngine.validate(order, State.demo, currentQuote);
    if (!v.valid) { toast(v.errors[0], 'error'); return; }

    const doIt = async () => {
      const btn = $('#place-order-btn');
      btn.disabled = true; btn.textContent = 'Placing…';
      try {
        const r = await TradingEngine.place(order, currentQuote);
        toast(`${side.toUpperCase()} order ${r.status}`, 'success');
        navigate('orders');
      } catch (e) {
        toast(e.message, 'error');
        btn.disabled = false;
        btn.textContent = `Place ${side.toUpperCase()} Order`;
      }
    };

    if (State.settings.confirmOrders) {
      const value = qty * currentQuote.price;
      const fee = TradingEngine.fees(value, type);
      showModal(
        'Confirm Demo Order',
        `${side.toUpperCase()} ${fmtQty(qty)} ${sym} @ ~${fmtMoney(currentQuote.price)}\nEst. total: ${fmtMoney(value + fee)} (fees ${fmtMoney(fee)})\n\nAll simulated.`,
        () => doIt()
      );
    } else doIt();
  });
};

async function closePosition(posId) {
  const p = State.positions.find(x => x.id === posId);
  if (!p) return;
  try {
    const q = await MarketData.getQuote(p.symbol);
    await TradingEngine.place({ symbol: p.symbol, side: 'sell', type: 'market', quantity: p.quantity, price: q.price }, q);
    toast('Position closed', 'success');
  } catch (e) { toast(e.message, 'error'); }
}

function showModal(title, message, onConfirm) {
  const ov = document.createElement('div');
  ov.className = 'overlay center';
  ov.innerHTML = `
    <div class="modal-box">
      <div class="font-bold text-lg" style="margin-bottom:8px">${esc(title)}</div>
      <div class="text-sm text-muted" style="margin-bottom:20px;white-space:pre-wrap">${esc(message)}</div>
      <div class="flex gap-8">
        <button class="btn btn-outline btn-block" id="modal-cancel">Cancel</button>
        <button class="btn btn-primary btn-block" id="modal-confirm">Confirm</button>
      </div>
    </div>`;
  document.body.appendChild(ov);
  ov.querySelector('#modal-cancel').onclick = () => ov.remove();
  ov.querySelector('#modal-confirm').onclick = () => { ov.remove(); onConfirm(); };
  ov.addEventListener('click', (e) => { if (e.target === ov) ov.remove(); });
}

/* ============================================================
   USER DATA LISTENERS
   ============================================================ */
function attachUserListeners(uid) {
  cleanupUserListeners();
  dbOnValue(`users/${uid}/profile`, (s) => {
    if (s.exists()) { State.profile = s.val(); if (activeScreen === 'profile') navigate('profile'); }
  });
  dbOnValue(`users/${uid}/demoAccount`, (s) => {
    if (s.exists()) {
      State.demo = s.val();
      if (activeScreen === 'dashboard') navigate('dashboard');
      else if (activeScreen === 'portfolio') navigate('portfolio');
    }
  });
  dbOnValue(`users/${uid}/orders`, (s) => {
    State.orders = s.exists() ? Object.values(s.val()) : [];
    if (activeScreen === 'dashboard') renderDashOrders();
    if (activeScreen === 'orders') renderOrdersList($('#order-tabs .tab.active')?.dataset.status || 'open');
  });
  dbOnValue(`users/${uid}/positions`, (s) => {
    State.positions = s.exists() ? Object.values(s.val()) : [];
    if (activeScreen === 'dashboard') renderDashPositions();
    if (activeScreen === 'portfolio') navigate('portfolio');
  });
  dbOnValue(`users/${uid}/transactions`, (s) => {
    State.transactions = s.exists() ? Object.values(s.val()).sort((a, b) => b.timestamp - a.timestamp) : [];
    if (activeScreen === 'transactions') renderTxList($('#tx-search')?.value || '');
  });
  dbOnValue(`users/${uid}/notifications`, (s) => {
    State.notifications = s.exists() ? Object.values(s.val()).sort((a, b) => b.timestamp - a.timestamp) : [];
    updateNotifBadge();
    if (activeScreen === 'notifications') navigate('notifications');
  });
  dbOnValue(`users/${uid}/watchlist`, (s) => {
    if (s.exists()) {
      State.watchlist = Object.values(s.val());
      if (activeScreen === 'watchlist') renderWatchlistContent();
      if (activeScreen === 'dashboard') loadDashWatchlist();
    }
  });
  dbOnValue(`users/${uid}/settings`, (s) => {
    if (s.exists()) {
      State.settings = { ...State.settings, ...s.val() };
      applyTheme(State.settings.theme);
    }
  });
}

   ============================================================ */
function applyTheme(theme) {
  if (theme === 'system') theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', theme);
}

function hideSplash() {
  const s = $('#splash');

  }
}

function showBootError(msg) {
  const el = $('#boot-error');
  if (el) { el.textContent = msg; el.classList.add('show'); }
}

// Firebase ready
window.addEventListener('firebase-ready', () => {
  try {
    fb().onAuthStateChanged(fb().auth, async (user) => {
      if (user) {
        State.user = user;
        // Ensure data exists
        try {
          const snap = await dbGet(`users/${user.uid}/demoAccount`);
          if (!snap.exists()) {
            await initUserData(user.uid, {
              name: user.displayName || 'User',
              username: (user.email || 'user').split('@')[0],
              email: user.email
            });
          }
        } catch (e) { console.warn('init check', e); }
        // Load settings to apply theme
        try {
          const s = await dbGet(`users/${user.uid}/settings`);
          if (s.exists()) { State.settings = { ...State.settings, ...s.val() }; applyTheme(State.settings.theme); }
        } catch (e) { }
        attachUserListeners(user.uid);
        navigate('dashboard');
        hideSplash();
      } else {
        State.user = null;
        cleanupUserListeners();
        navigate('login');
        hideSplash();
      }
    });
  } catch (e) {
    console.error('auth listener failed', e);
    navigate('login');
    hideSplash();
  }
});

// Firebase error fallback — still render login
window.addEventListener('firebase-error', (e) => {
  console.error('Firebase error', e.detail);
  showBootError('Firebase failed to load. Auth unavailable.');
  navigate('login');
  hideSplash();
});

// Timeout fallback: if Firebase never loads within 6s, show login anyway
setTimeout(() => {
  if (!State.user && activeScreen === null) {
    if (!window.__fb) {
      showBootError('Could not connect to Firebase. Running in limited mode.');
    }
    navigate('login');
    hideSplash();
  }
}, 6000);

// Hide splash after max 3s regardless
setTimeout(hideSplash, 3000);

// Online/offline
window.addEventListener('online', () => { $('#offline-banner')?.classList.remove('show'); toast('Back online', 'success'); });
window.addEventListener('offline', () => { $('#offline-banner')?.classList.add('show'); });

// Initialize icons once
if (window.lucide) window.lucide.createIcons();

// Expose for debugging
window.__asky = { State, navigate, MarketData, TradingEngine, Screens };
</script>
</body>
</html>
