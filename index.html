<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusNokos - Beli Nomor OTP</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- Google Fonts: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.8);
            --accent-primary: #6366f1;
            --accent-secondary: #8b5cf6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px 0;
        }

        /* Card Glassmorphism Effect */
        .glass-card {
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            padding: 40px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .glass-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 4px;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
        }

        .brand-title {
            font-weight: 700;
            font-size: 1.8rem;
            background: linear-gradient(90deg, #a78bfa, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        .brand-subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 30px;
        }

        /* Form Controls */
        .form-label {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .form-select, .form-control {
            background-color: rgba(15, 23, 42, 0.6);
            border: 1px solid #334155;
            color: var(--text-main);
            border-radius: 12px;
            padding: 12px 15px;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .form-select:focus, .form-control:focus {
            background-color: rgba(15, 23, 42, 0.9);
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.2);
            color: var(--text-main);
        }

        .form-select option {
            background-color: #1e293b;
            color: #fff;
        }

        /* Buttons */
        .btn-gradient {
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            padding: 14px;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        .btn-gradient:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.5);
            color: white;
        }

        .btn-outline-custom {
            border: 1px solid #334155;
            color: var(--text-muted);
            border-radius: 12px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-outline-custom:hover {
            background-color: rgba(255, 255, 255, 0.05);
            color: white;
            border-color: #64748b;
        }

        /* OTP Box */
        .otp-box {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.9));
            border: 1px dashed var(--accent-primary);
            border-radius: 16px;
            padding: 25px;
            text-align: center;
            position: relative;
            margin: 20px 0;
            box-shadow: inset 0 0 20px rgba(99, 102, 241, 0.1);
        }

        .otp-code {
            font-size: 2.5rem;
            font-weight: 700;
            color: #a78bfa;
            letter-spacing: 8px;
            text-shadow: 0 0 15px rgba(167, 139, 250, 0.6);
            margin: 0;
            word-break: break-all;
        }

        .copy-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: var(--text-muted);
            border-radius: 8px;
            padding: 5px 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .copy-btn:hover {
            background: var(--accent-primary);
            color: white;
        }

        /* Status Badge */
        .status-badge {
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 600;
            display: inline-block;
        }
        
        .status-waiting { background: rgba(234, 179, 8, 0.2); color: #fde047; border: 1px solid rgba(234, 179, 8, 0.3); }
        .status-success { background: rgba(34, 197, 94, 0.2); color: #86efac; border: 1px solid rgba(34, 197, 94, 0.3); }
        .status-failed { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.3); }

        /* Animations */
        .fade-in {
            animation: fadeIn 0.5s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Alert Security */
        .alert-security {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            border-radius: 12px;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            
            <!-- Card Utama -->
            <div class="glass-card">
                
                <!-- Header -->
                <div class="text-center">
                    <h1 class="brand-title">NexusNokos</h1>
                    <p class="brand-subtitle">Layanan Nomor Virtual OTP Cepat & Aman</p>
                </div>

                <!-- Peringatan Keamanan (Bisa dihapus jika sudah pakai backend) -->
                <div class="alert alert-security d-flex align-items-center mb-4" role="alert">
                    <i class="bi bi-shield-lock-fill me-2 fs-5"></i>
                    <div>Pastikan API Key Anda sudah diamankan di backend (config.php).</div>
                </div>

                <!-- SECTION 1: FORM PEMESANAN -->
                <div id="order-section" class="fade-in">
                    <div class="mb-4">
                        <label class="form-label"><i class="bi bi-grid-fill me-1"></i> Pilih Layanan</label>
                        <select id="service_id" class="form-select">
                            <option value="">Memuat layanan...</option>
                        </select>
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label"><i class="bi bi-globe2 me-1"></i> Pilih Negara</label>
                        <select id="country_id" class="form-select">
                            <option value="1">🇮🇩 Indonesia</option>
                            <option value="2">🇲🇾 Malaysia</option>
                            <option value="3">🇻🇳 Vietnam</option>
                            <!-- Sesuaikan dengan kode negara dari dokumentasi NexusSMM -->
                        </select>
                    </div>
                    
                    <button onclick="beliNokos()" id="btn-buy" class="btn btn-gradient w-100">
                        <i class="bi bi-cart-plus-fill me-2"></i> Beli Sekarang
                    </button>
                </div>

                <!-- SECTION 2: STATUS & OTP (Tersembunyi awalnya) -->
                <div id="status-section" class="d-none fade-in">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <span class="text-muted small">Order ID:</span>
                        <span id="order_id_display" class="fw-bold text-white small bg-dark px-3 py-1 rounded">-</span>
                    </div>

                    <div class="text-center mb-2">
                        <div id="status_badge" class="status-badge status-waiting">
                            <i class="bi bi-hourglass-split me-1"></i> Menunggu...
                        </div>
                    </div>

                    <!-- Kotak OTP -->
                    <div class="otp-box">
                        <button class="copy-btn" onclick="copyOTP()" title="Salin OTP">
                            <i class="bi bi-clipboard"></i>
                        </button>
                        <small class="text-muted d-block mb-2">Kode OTP / SMS:</small>
                        <h2 id="otp_display" class="otp-code">-</h2>
                    </div>

                    <button onclick="cekStatus()" id="btn-check" class="btn btn-gradient w-100 mb-3">
                        <i class="bi bi-arrow-repeat me-2"></i> Cek Status / OTP
                    </button>
                    
                    <button onclick="resetForm()" class="btn btn-outline-custom w-100">
                        <i class="bi bi-arrow-left me-2"></i> Kembali
                    </button>
                </div>
            </div>
            
            <p class="text-center text-muted mt-4 small">
                &copy; 2026 NexusNokos. Powered by NexusSMM API.
            </p>
        </div>
    </div>
</div>

<script>
    // ==========================================
    // KONFIGURASI API PROXY (Lokal)
    // ==========================================
    const API_PROXY_URL = 'api.php'; 

    let currentOrderId = null;
    let pollingInterval = null;

    // ==========================================
    // FUNGSI 1: MENGAMBIL DAFTAR LAYANAN
    // ==========================================
    async function loadServices() {
        const select = document.getElementById('service_id');
        
        try {
            const response = await fetch(API_PROXY_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({ action: 'get_services' })
            });
            
            const data = await response.json();
            
            select.innerHTML = '<option value="">-- Pilih Layanan --</option>';
            
            // Sesuaikan struktur JSON dengan respons asli NexusSMM
            if (data && data.data) {
                data.data.forEach(svc => {
                    select.innerHTML += `<option value="${svc.id}">${svc.name}</option>`;
                });
            } else {
                select.innerHTML = '<option value="">Gagal memuat layanan</option>';
            }
        } catch (error) {
            console.error("Error loading services:", error);
            select.innerHTML = '<option value="">Error koneksi ke server</option>';
        }
    }

    // ==========================================
    // FUNGSI 2: MEMBELI NOKOS
    // ==========================================
    async function beliNokos() {
        const serviceId = document.getElementById('service_id').value;
        const countryId = document.getElementById('country_id').value;
        
        if (!serviceId) {
            alert('Silakan pilih layanan terlebih dahulu!');
            return;
        }

        const btn = document.getElementById('btn-buy');
        const originalText = btn.innerHTML;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Memproses...';
        btn.disabled = true;

        try {
            const response = await fetch(API_PROXY_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({
                    action: 'buy_nokos',
                    service_id: serviceId,
                    country_id: countryId
                })
            });

            const data = await response.json();

            if (data && data.status === true) {
                currentOrderId = data.data.order_id;
                document.getElementById('order_id_display').innerText = currentOrderId;
                
                document.getElementById('order-section').classList.add('d-none');
                document.getElementById('status-section').classList.remove('d-none');
                document.getElementById('status-section').classList.add('fade-in');
                
                updateStatusUI('waiting');
                startPolling();
            } else {
                alert('Gagal membeli: ' + (data.message || 'Error tidak diketahui'));
            }
        } catch (error) {
            console.error("Error buying number:", error);
            alert('Terjadi kesalahan koneksi ke server lokal.');
        } finally {
            btn.innerHTML = originalText;
            btn.disabled = false;
        }
    }

    // ==========================================
    // FUNGSI 3: CEK STATUS & OTP
    // ==========================================
    async function cekStatus() {
        if (!currentOrderId) return;

        const btnCheck = document.getElementById('btn-check');
        const originalText = btnCheck.innerHTML;
        
        // Animasi loading pada tombol cek
        btnCheck.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Memeriksa...';
        btnCheck.disabled = true;

        try {
            const response = await fetch(API_PROXY_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({
                    action: 'check_status',
                    order_id: currentOrderId
                })
            });

            const data = await response.json();

            if (data && data.data) {
                const status = data.data.status;
                
                if (status === 'success' || status === 'completed' || status === 'received') {
                    updateStatusUI('success');
                    document.getElementById('otp_display').innerText = data.data.otp || data.data.sms || 'Tidak ada OTP';
                    stopPolling();
                } else if (status === 'pending' || status === 'waiting') {
                    updateStatusUI('waiting');
                } else {
                    updateStatusUI('failed');
                    stopPolling();
                }
            }
        } catch (error) {
            console.error("Error checking status:", error);
        } finally {
            btnCheck.innerHTML = originalText;
            btnCheck.disabled = false;
        }
    }

    // ==========================================
    // FUNGSI BANTU (UI, POLLING, COPY, RESET)
    // ==========================================
    
    // Update tampilan badge status
    function updateStatusUI(status) {
        const badge = document.getElementById('status_badge');
        if (status === 'success') {
            badge.className = 'status-badge status-success';
            badge.innerHTML = '<i class="bi bi-check-circle-fill me-1"></i> Berhasil';
        } else if (status === 'waiting') {
            badge.className = 'status-badge status-waiting';
            badge.innerHTML = '<i class="bi bi-hourglass-split me-1"></i> Menunggu SMS...';
        } else {
            badge.className = 'status-badge status-failed';
            badge.innerHTML = '<i class="bi bi-x-circle-fill me-1"></i> Gagal / Kadaluarsa';
        }
    }

    // Salin OTP ke clipboard
    function copyOTP() {
        const otpText = document.getElementById('otp_display').innerText;
        if (otpText && otpText !== '-') {
            navigator.clipboard.writeText(otpText).then(() => {
                const btn = document.querySelector('.copy-btn');
                const originalIcon = btn.innerHTML;
                btn.innerHTML = '<i class="bi bi-check-lg text-success"></i>';
                setTimeout(() => { btn.innerHTML = originalIcon; }, 2000);
            });
        }
    }

    function startPolling() {
        if (pollingInterval) clearInterval(pollingInterval);
        cekStatus(); 
        pollingInterval = setInterval(cekStatus, 5000); // Cek tiap 5 detik
    }

    function stopPolling() {
        if (pollingInterval) {
            clearInterval(pollingInterval);
            pollingInterval = null;
        }
    }

    function resetForm() {
        stopPolling();
        currentOrderId = null;
        document.getElementById('order_id_display').innerText = '-';
        document.getElementById('otp_display').innerText = '-';
        updateStatusUI('waiting');
        
        document.getElementById('status-section').classList.add('d-none');
        document.getElementById('order-section').classList.remove('d-none');
        document.getElementById('order-section').classList.add('fade-in');
    }

    // Jalankan loadServices saat halaman pertama kali dibuka
    window.onload = loadServices;

</script>
</body>
</html>
