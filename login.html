<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Masuk - ChatingYuk</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0e1a;--surface:#141a2c;--border:#232c47;--text:#e8ecf5;--text-2:#8b93ab;--primary:#6366f1;--primary-soft:rgba(99,102,241,.15);--grad:linear-gradient(135deg,#6366f1,#8b5cf6 60%,#ec4899)}
[data-theme=light]{--bg:#f4f6fb;--surface:#fff;--border:#e2e8f0;--text:#0f172a;--text-2:#64748b;--primary-soft:rgba(99,102,241,.1)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:inherit;text-decoration:none}
.muted{color:var(--text-2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:10px;font-weight:600;font-size:14px;transition:.2s;width:100%}
.btn-primary{background:var(--grad);color:#fff;box-shadow:0 4px 16px rgba(99,102,241,.3)}
.btn-primary:hover{transform:translateY(-1px)}
.btn[disabled]{opacity:.5;pointer-events:none}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px}
.brand-logo{width:36px;height:36px;border-radius:11px;background:var(--grad);display:grid;place-items:center;color:#fff}
.brand-name{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.wrap{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
.aside{background:var(--grad);padding:44px 40px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;position:relative;overflow:hidden}
.aside::before{content:'';position:absolute;top:-40%;right:-30%;width:80%;height:80%;background:radial-gradient(circle,rgba(255,255,255,.15),transparent 60%)}
.aside>*{position:relative;z-index:1}
.aside .brand-logo{background:rgba(255,255,255,.2);box-shadow:none}
.aside .brand-name{-webkit-text-fill-color:#fff;background:none;color:#fff}
.aside h2{font-size:32px;font-weight:800;letter-spacing:-.02em;margin-bottom:14px}
.aside p{opacity:.9;font-size:15px;line-height:1.6;max-width:400px}
.main{display:flex;align-items:center;justify-content:center;padding:44px 22px;background:var(--bg)}
.card{width:100%;max-width:420px}
.card h1{font-size:28px;font-weight:800;letter-spacing:-.02em;margin-bottom:6px}
.card .sub{color:var(--text-2);font-size:14px;margin-bottom:26px}
.field{margin-bottom:14px;display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--text-2)}
.input{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text);font-size:14px;transition:.2s;outline:none}
.input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.input-wrap{position:relative}
.input-wrap .input{padding-right:42px}
.eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);padding:8px;color:var(--text-2);opacity:.7;border-radius:6px}
.eye:hover{opacity:1;background:var(--primary-soft)}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0 18px}
.check{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-2);cursor:pointer}
.check input{accent-color:var(--primary);width:16px;height:16px}
.link{color:var(--primary);font-weight:600;font-size:13px}
.link:hover{text-decoration:underline}
.alert{padding:12px 14px;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);color:#fecaca;border-radius:10px;font-size:13px;margin-bottom:16px;display:none}
.alert.show{display:block}
.alert.ok{background:rgba(16,185,129,.12);border-color:rgba(16,185,129,.3);color:#a7f3d0}
.foot{text-align:center;margin-top:22px;font-size:14px;color:var(--text-2)}
.foot a{color:var(--primary);font-weight:600}
@media(max-width:860px){.wrap{grid-template-columns:1fr}.aside{display:none}}
</style>
</head>
<body>

<div class="wrap">
  <div class="aside">
    <a href="index.html" class="brand">
      <div class="brand-logo">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
      </div>
      <span class="brand-name">ChatingYuk</span>
    </a>
    <div>
      <h2>Selamat datang kembali</h2>
      <p>Lanjutkan obrolanmu bersama teman dan komunitas di ChatingYuk.</p>
    </div>
    <small style="font-size:12px;opacity:.7">Ngobrol Tanpa Batas.</small>
  </div>

  <div class="main">
    <div class="card">
      <h1>Masuk</h1>
      <p class="sub">Masuk ke akun ChatingYuk kamu</p>

      <div id="err" class="alert"></div>

      <form id="form">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" class="input" placeholder="kamu@email.com" required autocomplete="email">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <input type="password" id="password" class="input" placeholder="Password" required minlength="6" autocomplete="current-password">
            <button type="button" class="eye" data-eye="password" aria-label="Lihat password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <div class="row-between">
          <label class="check"><input type="checkbox" id="remember" checked><span>Ingat saya</span></label>
          <button type="button" class="link" id="forgot">Lupa password?</button>
        </div>
        <button type="submit" class="btn btn-primary" id="submit"><span id="btn-text">Masuk</span></button>
      </form>

      <div class="foot">Belum punya akun? <a href="register.html">Daftar di sini</a></div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const app = initializeApp({
  apiKey: "AIzaSyCHr0eemIkfHNFDUkSaFDklp_c1OgmSnl8",
  authDomain: "mybro-9ba5f.firebaseapp.com",
  databaseURL: "https://mybro-9ba5f-default-rtdb.firebaseio.com/",
  projectId: "mybro-9ba5f",
  storageBucket: "mybro-9ba5f.appspot.com"
});
const auth = getAuth(app);

document.documentElement.setAttribute('data-theme', localStorage.getItem('cy_theme') || 'dark');
onAuthStateChanged(auth, u => { if (u) location.href = 'chat.html'; });

document.querySelectorAll('[data-eye]').forEach(btn => {
  btn.onclick = () => {
    const i = document.getElementById(btn.dataset.eye);
    i.type = i.type === 'password' ? 'text' : 'password';
  };
});

const form = document.getElementById('form');
const err = document.getElementById('err');
const btn = document.getElementById('submit');
const btnText = document.getElementById('btn-text');

function showErr(m, ok = false) {
  err.textContent = m;
  err.className = 'alert show' + (ok ? ' ok' : '');
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  err.className = 'alert';
  const email = form.email.value.trim();
  const password = form.password.value;
  if (!email || !password) return showErr('Email dan password wajib diisi.');
  btnText.textContent = 'Memproses...';
  btn.disabled = true;
  try {
    await signInWithEmailAndPassword(auth, email, password);
    location.href = 'chat.html';
  } catch (e2) {
    console.error(e2);
    const map = {
      'auth/invalid-credential': 'Email atau password salah.',
      'auth/user-not-found': 'Akun tidak ditemukan.',
      'auth/wrong-password': 'Password salah.',
      'auth/too-many-requests': 'Terlalu banyak percobaan. Coba lagi nanti.',
      'auth/invalid-email': 'Format email tidak valid.'
    };
    showErr(map[e2.code] || 'Gagal login. Coba lagi.');
  } finally {
    btnText.textContent = 'Masuk';
    btn.disabled = false;
  }
});

document.getElementById('forgot').onclick = async () => {
  const email = form.email.value.trim();
  if (!email) return showErr('Masukkan email dulu untuk reset password.');
  try {
    await sendPasswordResetEmail(auth, email);
    showErr('Email reset password telah dikirim. Cek inbox kamu.', true);
  } catch {
    showErr('Gagal mengirim email reset.');
  }
};
</script>
</body>
</html>
